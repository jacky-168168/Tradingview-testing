<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>系統健康｜台股量化網站</title>
<meta name="description" content="G 盤中選股、重大新聞、官方資料日期與 GitHub 更新健康狀態，不把過期資料當成正常。">
<style>
:root{color-scheme:light;--bg:#f4f6f9;--text:#172033;--muted:#65748c;--line:#e1e7ef;--good:#047857;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;font-size:14px}
main{max-width:960px;margin:0 auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
h1{margin:0;font-size:23px}.sub{margin:5px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
a{color:#1d4ed8}button,.btn{font:inherit;border:1px solid var(--line);padding:9px 12px;border-radius:9px;background:white;text-decoration:none;cursor:pointer;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;min-width:0}.card h2{font-size:16px;margin:0 0 10px}
.status{font-weight:900;font-size:19px}.status.good{color:var(--good)}.status.bad{color:var(--bad)}
.meta{font-size:12px;color:#475569;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}
.note{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:13px;margin:16px 0;font-size:12px;line-height:1.8;color:#475569}
footer{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.7}
@media(max-width:650px){main{padding:12px}.cards{grid-template-columns:1fr}}
</style><script src="./site-access.js"></script></head>
<body><main>
<header><div><h1>🛡 系統健康</h1><p class="sub">資料新鮮度、盤中 G、新聞來源與 Actions 的獨立檢視；非交易訊號。</p></div>
<div class="actions"><a class="btn" href="./index.html">← 大盤首頁</a><button type="button" id="refresh">↻ 重新檢查</button></div></header>
<p class="note" id="summary" aria-live="polite">正在查詢可驗證資料…</p>
<div class="cards">
 <section class="card"><h2>G 盤中選股</h2><div class="status" id="gState">核對中</div><div class="meta" id="gDetail">—</div></section>
 <section class="card"><h2>重大新聞</h2><div class="status" id="newsState">核對中</div><div class="meta" id="newsDetail">—</div></section>
 <section class="card"><h2>主更新 Actions</h2><div class="status" id="actionsState">核對中</div><div class="meta" id="actionsDetail">—</div></section>
 <section class="card"><h2>網站發布與資料來源</h2><div class="status" id="pagesState">核對中</div><div class="meta" id="pagesDetail">—</div></section>
</div>
<footer>僅在臺灣實際開市日 09:50～13:45 對 G 盤中資料進行異常判斷。GitHub API 暫時不可讀會標記「無法驗證」，不冒充健康。最新來源紀錄與新聞內容不代表證券推薦。GitHub 排程有可能延遲，Cloudflare 外部時鐘須完成實際部署才能生效。</footer>
</main><script src="./system-health.js"></script></body></html>
