<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A/D 回測與 Edge</title><style>
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1500px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e6e9f0;border-radius:14px;padding:16px;margin-top:14px}.muted{color:#6b7280;font-size:12px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px;border-bottom:1px solid #eef0f4;text-align:right;white-space:nowrap}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}.good{color:#047857;font-weight:900}.warn{color:#b45309;font-weight:900}.bad{color:#b91c1c;font-weight:900}a{color:#2563eb;text-decoration:none}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn,select{border:1px solid #d8dce7;background:#fff;border-radius:9px;padding:7px 10px;font-weight:700;color:#172033}.btn{display:inline-block}.note{line-height:1.7}
</style></head><body><div class="wrap"><h1>🧪 A / D 回測｜GitHub Python Engine</h1><div class="toolbar muted"><a href="./index.html">← 回選股 Dashboard</a><a class="btn" href="https://github.com/jacky-168168/Tradingview-testing/actions/workflows/tw-stock-backtest.yml" target="_blank" rel="noopener">＋ 建立新的日期回測</a><label>歷史結果 <select id="historySelect"><option value="latest.json">最新</option></select></label><span id="meta">載入中...</span></div>
<div class="card"><b>統計 Edge 體檢｜A / D × 1D / 3D / 5D / 10D / 20D</b><div class="scroll"><table><thead><tr><th>模型</th><th>週期</th><th>N(檢定)</th><th>期望值</th><th>勝率</th><th>PF</th><th>Sharpe</th><th>MDD</th><th>t p</th><th>Bootstrap p</th><th>OOS</th><th>MC95 MDD</th><th>裁決</th></tr></thead><tbody id="edge"><tr><td colspan="13">尚無資料</td></tr></tbody></table></div></div>
<div class="card"><b>Top3 固定三槽摘要</b><div class="scroll"><table><thead><tr><th>模型</th><th>週期</th><th>N</th><th>平均</th><th>中位</th><th>勝率</th><th>最大</th><th>最小</th></tr></thead><tbody id="sum"></tbody></table></div></div>
<div class="card muted note"><b>使用方式：</b>要跑新日期區間時按上面的「建立新的日期回測」，在 GitHub Actions 輸入開始 / 結束日期。完成後會自動保存該區間 JSON 並部署到這頁；舊區間最多保留最近 50 份索引。<div id="notes" style="margin-top:8px"></div></div></div>
<script>
const F=(x,n=2)=>Number.isFinite(Number(x))?Number(x).toFixed(n):'—',P=x=>x==null?'—':F(x)+'%',V={gambling:['負期望','bad'],insufficient:['樣本不足','warn'],luck_suspected:['疑似運氣','warn'],fragile_edge:['脆弱優勢','warn'],statistical_edge:['統計優勢','good']};
function E(d){let o=[];for(const m of d.models||[]){const a=d.edgeAudit?.models?.[m.id]||{};for(const h of[1,3,5,10,20]){const x=a['d'+h];if(!x)continue;const v=V[x.verdict]||[x.verdict,''];o.push(`<tr><td><b>${m.id} ${m.name}</b></td><td>${h}D</td><td>${x.testN||0}/${x.n||0}</td><td>${P(x.expectancy)}</td><td>${P(x.winRate)}</td><td>${x.profitFactorInfinite?'∞':F(x.profitFactor)}</td><td>${F(x.sharpe)}</td><td>${P(x.maxDrawdown)}</td><td>${F(x.tP,5)}</td><td>${F(x.bootstrapP,5)}</td><td>${x.oos?.valid?(x.oos.pass?'✅':'⚠'):'—'}</td><td>${x.monteCarlo?.valid?P(x.monteCarlo.p95Mdd):'—'}</td><td class="${v[1]}">${v[0]}</td></tr>`)}}return o.join('')}
function S(d){let o=[];for(const m of d.models||[]){const x=(m.summary||[]).find(z=>z.group==='Top3固定三槽');if(!x)continue;for(const h of[1,3,5,10,20]){const s=x['d'+h]||{};o.push(`<tr><td><b>${m.id} ${m.name}</b></td><td>${h}D</td><td>${s.n||0}</td><td>${P(s.avg)}</td><td>${P(s.median)}</td><td>${P(s.win)}</td><td>${P(s.max)}</td><td>${P(s.min)}</td></tr>`)}}return o.join('')}
async function load(file='latest.json'){try{const r=await fetch('./data/backtest/'+file+'?'+Date.now());if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();meta.textContent=`${d.period?.start||'--'} ～ ${d.period?.end||'--'} ｜ 訊號日 ${d.signalDays||0} ｜ ${d.elapsedSeconds||0}s ｜ 產生 ${d.generatedAt||'--'}`;edge.innerHTML=E(d)||'<tr><td colspan="13">尚無回測資料</td></tr>';sum.innerHTML=S(d);notes.textContent=(d.notes||[]).join(' ｜ ')}catch(e){meta.textContent='載入失敗：'+e.message}}
async function historyIndex(){try{const r=await fetch('./data/backtest/index.json?'+Date.now());if(!r.ok)return;const xs=await r.json();for(const x of xs){const o=document.createElement('option');o.value=x.file;o.textContent=`${x.start}～${x.end}｜${x.signalDays}日`;document.getElementById('historySelect').appendChild(o)}}catch(e){}}
document.getElementById('historySelect').addEventListener('change',e=>load(e.target.value));historyIndex();load();
</script></body></html>
