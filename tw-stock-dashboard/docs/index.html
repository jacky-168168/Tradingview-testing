<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股 A/D 選股 Dashboard</title><style>body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1400px;margin:auto;padding:20px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.card{background:white;border:1px solid #e6e9f0;border-radius:14px;padding:16px;margin-top:14px}.tabs button,.link{border:1px solid #d8dce7;background:white;padding:8px 14px;border-radius:10px;font-weight:800;cursor:pointer;text-decoration:none;color:#172033}.tabs button.on{background:#111827;color:#fff}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px 8px;border-bottom:1px solid #eef0f4;text-align:right;white-space:nowrap}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}.muted{color:#6b7280;font-size:12px}.scroll{overflow:auto}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#ede9fe;color:#6d28d9;font-weight:900}</style></head><body><div class="wrap"><div class="top"><h1 style="margin:0">📈 台股 A / D 選股</h1><span class="badge">GitHub Python Engine</span><a class="link" href="./backtest.html">🧪 回測 / Edge</a></div><div id="meta" class="muted">載入中...</div><div class="card tabs"><button id="A" class="on">A 原始多因子</button><button id="D">D 技術強勢</button></div><div class="card"><div class="scroll"><table><thead><tr><th>Rank</th><th>股票</th><th>市場</th><th>總分</th><th>收盤</th><th>成交額(億)</th><th>RS20</th><th>RVOL</th><th>5D</th><th>20D</th><th>距20日高</th><th>Vol.D</th></tr></thead><tbody id="tb"><tr><td colspan="12">載入中...</td></tr></tbody></table></div></div><div class="card muted">Phase 2：A/D 全市場掃描、雙向歷史 K 增量快取、Python 長區間回測與 Edge Audit 已加入。Risk / Top Watch / 題材仍待移植。</div></div><script>let DATA=null,MODEL='A';const fmt=(x,n=2)=>Number.isFinite(Number(x))?Number(x).toFixed(n):'—';function render(){const xs=DATA?.models?.[MODEL]||[];document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.id===MODEL));document.getElementById('tb').innerHTML=xs.length?xs.map((x,i)=>`<tr><td>${i+1}</td><td>${x.code} ${x.name}</td><td>${x.market}</td><td><b>${fmt(x.total,0)}</b></td><td>${fmt(x.close)}</td><td>${fmt(x.turnoverB)}</td><td>${fmt(x.rs20)}%</td><td>${fmt(x.rvol)}</td><td>${fmt(x.ret5)}%</td><td>${fmt(x.ret20)}%</td><td>${fmt(x.breakoutPct)}%</td><td>${fmt(x.volD)}%</td></tr>`).join(''):'<tr><td colspan="12">尚無結果</td></tr>'}['A','D'].forEach(id=>document.getElementById(id).onclick=()=>{MODEL=id;render()});fetch('./data/latest.json?'+Date.now()).then(r=>r.json()).then(d=>{DATA=d;document.getElementById('meta').textContent=`更新 ${d.generatedAt||'--'} ｜ 股票池 ${d.universeCount||0} ｜ 歷史K成功 ${d.historyOk||0} ｜ 錯誤 ${d.historyErrors||0}`;render()}).catch(e=>document.getElementById('meta').textContent='尚未產生資料：'+e.message);</script></body></html>
