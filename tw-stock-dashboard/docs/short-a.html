<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>S-A 空方候選｜台股選股</title><style>body{font:15px system-ui,sans-serif;background:#0d1420;color:#e5e7eb;max-width:1100px;margin:20px auto;padding:0 14px}a{color:#8ecaff}h1{font-size:25px}.panel{background:#172233;padding:16px;border-radius:12px;margin:14px 0}.muted{color:#aebcd0;line-height:1.6}select,button{font:inherit;color:inherit;background:#23364e;border:1px solid #54647a;padding:9px;border-radius:6px}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{padding:10px;text-align:right;border-bottom:1px solid #354252}td:nth-child(2),th:nth-child(2){text-align:left}.scroll{overflow:auto}#status{color:#f2cf88}</style><script src="./site-access.js"></script></head><body><a href="./selections.html">← 返回選股排行</a><h1>S-A 弱勢延續｜空方候選 Top 10</h1><div class="panel"><p class="muted">每日 09:15 開盤前三根 5 分 K 完成後，依前 5 日相對 0050 弱勢及開盤相對量排名。僅候選，不是放空進場訊號。正式進場仍須跌破開盤區間低點與 VWAP；實際下單前需確認當沖資格、限制及回補風險。</p><p class="muted">價格 10–350 元、前20日均成交額 ≥3億元、ATR 1.8–11%、相對5日 ≤−2 個百分點、開盤跳空 −3.5%～+1%、開盤相對量 ≥1.3。固定研究股票池，非全市場；兩個月逐日重建，非當時實際發布的榜單。</p><label for="dates">榜單日期 </label><select id="dates" disabled></select> <button id="download" disabled>下載兩個月 CSV</button><p id="status" role="status">讀取歷史候選中…</p><div class="scroll"><table><thead><tr><th>排名</th><th>股票</th><th>市場</th><th>分數</th><th>相對5日 (百分點)</th><th>跳空 %</th><th>相對量</th><th>ATR %</th><th>均成交額 (億)</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>
const dates=document.querySelector('#dates'),rows=document.querySelector('#rows'),status=document.querySelector('#status'),download=document.querySelector('#download');let archive;
function render(){const d=archive.days[dates.value];rows.replaceChildren();const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());status.textContent=d.date+'｜'+(d.date===today?'今日開盤候選':'歷史候選（不是今日）')+'｜資料 '+d.valid_symbols+'/'+d.pool_size+'｜'+(d.status==='available'?'符合 '+d.qualified+' 檔（最多顯示10檔）':'資料覆蓋不足，不顯示排行');for(const x of d.rows){const tr=document.createElement('tr');for(const v of [x.rank,x.symbol,x.market,x.score,x.relative5_pctpt,x.gap_pct,x.rvol,x.atr_pct,(x.turnover20_twd/1e8).toFixed(2)]){const td=document.createElement('td');td.textContent=v;tr.append(td)}rows.append(tr)}if(!d.rows.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=9;td.textContent=d.status==='available'?'沒有符合條件的股票':'資料不足，無法確認候選';tr.append(td);rows.append(tr)}}
dates.onchange=render;download.onclick=()=>{const csv=['date,rank,symbol,market,score,relative5_pctpt,gap_pct,rvol,atr_pct,turnover20_twd'];for(const [day,d] of Object.entries(archive.days))for(const x of d.rows)csv.push([day,x.rank,x.symbol,x.market,x.score,x.relative5_pctpt,x.gap_pct,x.rvol,x.atr_pct,x.turnover20_twd].join(','));const u=URL.createObjectURL(new Blob(['\ufeff'+csv.join('\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='short-a-top10.csv';a.click();URL.revokeObjectURL(u)};
fetch('./data/short_a/history.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(x=>{if(x.schema!=='SHORT_A_TOP10_V1'||!x.days||!Object.keys(x.days).length)throw Error('資料格式不符');archive=x;for(const k of Object.keys(x.days).sort().reverse()){const o=document.createElement('option');o.value=k;o.textContent=k;dates.append(o)}dates.disabled=download.disabled=false;render()}).catch(e=>{status.textContent='尚無已生成的歷史候選檔案：'+e.message+'。不以其他模型代替。'});
</script></body></html>
