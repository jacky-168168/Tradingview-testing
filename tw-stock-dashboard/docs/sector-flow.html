<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>板塊資金流向｜台股量化選股</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#172033;--muted:#7b8494;--border:#e4e8ef;--red:#dc2626;--green:#16a34a;--blue:#2563eb;--orange:#d97706}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}.wrap{max-width:1480px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top h1{margin:0;font-size:26px}.btn{border:1px solid var(--border);background:#fff;color:var(--text);padding:9px 12px;border-radius:10px;text-decoration:none;font-weight:800;font-size:12px;cursor:pointer}.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:14px}.muted{color:var(--muted);font-size:12px}.states{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.state{padding:14px;border-radius:12px;background:#f8fafc}.state b{font-size:20px}.chartbox{overflow:auto}.chartwrap{min-width:860px}.axisnote{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:1px solid var(--border);background:#fff;border-radius:9px;padding:7px 11px;font-weight:800;cursor:pointer}.tabs button.on{background:#111827;color:#fff}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:9px 8px;border-bottom:1px solid #eef0f4;font-size:12px;text-align:right}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}.pos{color:var(--red)}.neg{color:var(--green)}.pill{padding:3px 7px;border-radius:99px;font-weight:900;font-size:11px}.tide{background:#fee2e2;color:#991b1b}.rotate{background:#ffedd5;color:#9a3412}.watch{background:#dbeafe;color:#1e40af}.ebb{background:#dcfce7;color:#166534}.legend{font-size:11px;line-height:1.6}.footer{text-align:center;color:var(--muted);font-size:10px;margin:18px 0}@media(max-width:700px){.wrap{padding:12px}.states{grid-template-columns:repeat(2,1fr)}.top h1{font-size:22px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>🌊 板塊資金流向</h1><div id="meta" class="muted">載入中...</div></div><div><a class="btn" href="./index.html">← 今日 Dashboard</a> <button id="reload" class="btn">↻ 重新載入</button></div></div>
<div class="states"><div class="state"><div class="muted">漲潮・加速流入</div><b id="cTide">0</b></div><div class="state"><div class="muted">輪動・流入放緩</div><b id="cRotate">0</b></div><div class="state"><div class="muted">觀望・流出放緩</div><b id="cWatch">0</b></div><div class="state"><div class="muted">退潮・加速流出</div><b id="cEbb">0</b></div></div>
<div class="card"><div class="axisnote"><div><b>板塊泡泡圖</b><div class="muted">越右＝近5日法人估算淨流入越多；越上＝近5日力道比近20日平均更偏買；泡泡越大＝近20日資金活動越大。</div></div><div class="tabs"><button id="all" class="on">全部</button><button id="漲潮">漲潮</button><button id="輪動">輪動</button><button id="觀望">觀望</button><button id="退潮">退潮</button></div></div><div class="chartbox"><div class="chartwrap"><svg id="chart" viewBox="0 0 1000 520" width="100%" height="520"></svg></div></div></div>
<div class="card"><b>板塊排行榜</b><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>板塊</th><th>狀態</th><th>今日</th><th>近5日</th><th>近20日</th><th>加速度</th><th>20日規模</th><th>5日主要貢獻股</th></tr></thead><tbody id="tb"><tr><td colspan="8">載入中...</td></tr></tbody></table></div></div>
<div class="card legend"><b>計算方式</b><div id="formula" class="muted" style="margin-top:7px"></div><div class="muted" style="margin-top:7px">資金金額為「三大法人買賣超股數 × 當日收盤價」的估算值，用於比較板塊間資金方向與加速度，不等同交易所逐筆實際成交金額。板塊分類採上市櫃公司產業分類。</div></div>
<div class="footer">資料來源：臺灣證券交易所、證券櫃檯買賣中心公開資料；僅供量化研究與交易輔助。</div>
</div>
<script>
var DATA=null,FILTER="all";function E(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}function N(x,n){var v=Number(x);return Number.isFinite(v)?v.toFixed(n==null?2:n):"—"}function cls(x){return Number(x)>=0?"pos":"neg"}function pill(s){return '<span class="pill '+(s==="漲潮"?"tide":s==="輪動"?"rotate":s==="觀望"?"watch":"ebb")+'">'+E(s)+'</span>'}
function rows(){var xs=(DATA&&DATA.sectors)||[];return FILTER==="all"?xs:xs.filter(function(x){return x.state===FILTER})}
function renderTable(){var xs=rows();tb.innerHTML=xs.length?xs.map(function(x){var leaders=(x.leaders||[]).map(function(z){return E(z.code+" "+z.name)+" <span class='"+cls(z.amount5)+"'>"+(Number(z.amount5)>=0?"+":"")+N(z.amount5)+"</span>"}).join("<br>");return "<tr><td><b>"+E(x.sector)+"</b></td><td>"+pill(x.state)+"</td><td class='"+cls(x.flow1)+"'>"+N(x.flow1)+" 億</td><td class='"+cls(x.flow5)+"'><b>"+N(x.flow5)+" 億</b></td><td class='"+cls(x.flow20)+"'>"+N(x.flow20)+" 億</td><td class='"+cls(x.accel5)+"'>"+N(x.accel5)+" 億</td><td>"+N(x.gross20)+" 億</td><td style='text-align:left'>"+(leaders||"—")+"</td></tr>"}).join(""):"<tr><td colspan='8'>無符合板塊</td></tr>"}
function renderChart(){var xs=rows(),svg=chart,W=1000,H=520,L=70,R=25,T=35,B=55;svg.innerHTML="";if(!xs.length)return;var mx=Math.max(1,...xs.map(x=>Math.abs(Number(x.flow5)||0))),my=Math.max(1,...xs.map(x=>Math.abs(Number(x.accel5)||0))),ms=Math.max(1,...xs.map(x=>Number(x.gross20)||0));function X(v){return L+(W-L-R)*(Number(v)/mx+1)/2}function Y(v){return T+(H-T-B)*(1-(Number(v)/my+1)/2)}function S(tag,a,t){var e=document.createElementNS("http://www.w3.org/2000/svg",tag);Object.keys(a||{}).forEach(k=>e.setAttribute(k,a[k]));if(t!=null)e.textContent=t;svg.appendChild(e);return e}var x0=X(0),y0=Y(0);S("line",{x1:L,y1:y0,x2:W-R,y2:y0,stroke:"#cbd5e1","stroke-width":1});S("line",{x1:x0,y1:T,x2:x0,y2:H-B,stroke:"#cbd5e1","stroke-width":1});S("text",{x:W/2,y:H-14,"text-anchor":"middle",fill:"#64748b","font-size":12},"近5日法人估算淨流入（億） →");S("text",{x:18,y:H/2,transform:"rotate(-90 18 "+H/2+")","text-anchor":"middle",fill:"#64748b","font-size":12},"相對20日平均5日力道（億） →");xs.forEach(function(x){var r=8+24*Math.sqrt((Number(x.gross20)||0)/ms),cx=X(x.flow5),cy=Y(x.accel5),fill=x.state==="漲潮"?"#ef4444":x.state==="輪動"?"#f59e0b":x.state==="觀望"?"#3b82f6":"#22c55e";var g=S("g",{});var c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",cx);c.setAttribute("cy",cy);c.setAttribute("r",r);c.setAttribute("fill",fill);c.setAttribute("fill-opacity",".65");c.setAttribute("stroke",fill);c.setAttribute("stroke-width","1.5");var title=document.createElementNS("http://www.w3.org/2000/svg","title");title.textContent=x.sector+"｜"+x.state+"｜5D "+N(x.flow5)+"億｜加速度 "+N(x.accel5)+"億";c.appendChild(title);g.appendChild(c);var tx=document.createElementNS("http://www.w3.org/2000/svg","text");tx.setAttribute("x",cx);tx.setAttribute("y",cy+4);tx.setAttribute("text-anchor","middle");tx.setAttribute("font-size",Math.max(9,Math.min(12,r/2.1)));tx.setAttribute("font-weight","800");tx.setAttribute("fill","#111827");tx.textContent=x.sector;g.appendChild(tx);svg.appendChild(g)})}
function render(){var c=DATA.counts||{};cTide.textContent=c["漲潮"]||0;cRotate.textContent=c["輪動"]||0;cWatch.textContent=c["觀望"]||0;cEbb.textContent=c["退潮"]||0;document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("on",b.id===FILTER)});renderChart();renderTable()}
async function load(){try{var r=await fetch("./data/latest.json?"+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);var j=await r.json();DATA=((j.panels||{}).sectorFlow)||{sectors:[]};var cv=DATA.coverage||{};meta.textContent="資料日 "+(DATA.dataDate||j.dataDate||"—")+" ｜ TWSE "+(cv.twseDays||0)+"/"+(cv.tradingDays||0)+"日 ｜ TPEx "+(cv.tpexDays||0)+"/"+(cv.tradingDays||0)+"日";var f=DATA.formula||{};formula.textContent="X："+(f.x||"—")+" ｜ Y："+(f.y||"—")+" ｜ 泡泡："+(f.size||"—");render()}catch(e){meta.textContent="載入失敗："+e.message;tb.innerHTML="<tr><td colspan='8'>資料載入失敗</td></tr>"}}
["all","漲潮","輪動","觀望","退潮"].forEach(function(id){document.getElementById(id).onclick=function(){FILTER=id;render()}});reload.onclick=load;load();
</script>
</body></html>
