<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股 A/D 歷史快照</title><style>
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1500px;margin:auto;padding:20px}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid #e6e9f0;border-radius:14px;padding:16px;margin-top:14px}.muted{color:#6b7280;font-size:12px}.btn,select{border:1px solid #d8dce7;background:#fff;border-radius:9px;padding:7px 10px;font-weight:700;color:#172033;text-decoration:none}.tabs button{border:1px solid #d8dce7;background:#fff;padding:8px 14px;border-radius:10px;font-weight:800;cursor:pointer}.tabs button.on{background:#111827;color:#fff}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px;border-bottom:1px solid #eef0f4;text-align:right;white-space:nowrap}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
</style></head><body><div class="wrap"><div class="top"><h1 style="margin:0">🗂️ A / D 歷史快照</h1><a class="btn" href="./index.html">← 今日 Dashboard</a><label>日期 <select id="day"><option>讀取中...</option></select></label><span id="meta" class="muted"></span></div><div class="card tabs"><button id="A" class="on">A 原始多因子</button><button id="D">D 技術強勢</button></div><div class="card"><div class="scroll"><table><thead><tr><th>Rank</th><th>股票</th><th>市場</th><th>題材</th><th>總分</th><th>SAR</th><th>收盤</th><th>股本(億)</th><th>成交額(億)</th><th>外資</th><th>投信</th><th>RS20</th><th>RVOL</th><th>5D</th><th>20D</th><th>訊號</th></tr></thead><tbody id="tb"><tr><td colspan="16">尚無資料</td></tr></tbody></table></div></div></div><script>
let DATA=null,MODEL='A';const F=(x,n=2)=>Number.isFinite(Number(x))?Number(x).toFixed(n):'—',P=x=>Number.isFinite(Number(x))?F(x)+'%':'—';
function render(){const xs=DATA?.models?.[MODEL]||[];document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.id===MODEL));tb.innerHTML=xs.length?xs.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.code} ${x.name}</b></td><td>${x.market}</td><td>${x.theme||'—'}</td><td><b>${F(x.total??x.score,0)}</b></td><td>${x.sarText||'—'}</td><td>${F(x.close)}</td><td>${F(x.capitalB??x.capital)}</td><td>${F(x.turnoverB??x.turnover)}</td><td>${F(x.foreignToday,0)}</td><td>${F(x.trustToday,0)}</td><td>${P(x.rs20)}</td><td>${F(x.rvol)}</td><td>${P(x.ret5)}</td><td>${P(x.ret20)}</td><td>${x.signal||''}</td></tr>`).join(''):'<tr><td colspan="16">該模型無股票</td></tr>'}
async function load(date){try{const r=await fetch('./data/daily/'+date+'.json?'+Date.now());if(!r.ok)throw new Error('HTTP '+r.status);DATA=await r.json();meta.textContent=`資料日 ${DATA.dataDate||date} ｜ Risk ${DATA.risk?.score??'—'} ${DATA.risk?.state||''} ｜ 更新 ${DATA.generatedAt||'--'}`;render()}catch(e){meta.textContent='讀取失敗：'+e.message}}
async function init(){const r=await fetch('./data/daily/index.json?'+Date.now());if(!r.ok){day.innerHTML='<option>尚無歷史快照</option>';return}const xs=await r.json();day.innerHTML='';for(const x of xs){const o=document.createElement('option');o.value=x.date;o.textContent=`${x.date}｜Risk ${x.riskScore??'—'}｜A${x.aCount??0}/D${x.dCount??0}`;day.appendChild(o)}if(xs.length)load(xs[0].date)}
['A','D'].forEach(id=>document.getElementById(id).onclick=()=>{MODEL=id;render()});day.addEventListener('change',()=>load(day.value));init();
</script></body></html>
