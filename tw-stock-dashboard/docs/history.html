<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股 D/A 歷史快照</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;margin:0;background:#f4f6f9;color:#172033}.wrap{max-width:1500px;margin:auto;padding:20px}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:16px;margin-top:14px}.muted{color:#7b8494;font-size:12px}.btn,select{border:1px solid #d8dce7;background:#fff;border-radius:9px;padding:8px 10px;font-weight:700;color:#172033;text-decoration:none}.tabs button{border:1px solid #d8dce7;background:#fff;padding:8px 14px;border-radius:10px;font-weight:800;cursor:pointer}.tabs button.on{background:#111827;color:#fff}.primary:after{content:"主模型";font-size:9px;margin-left:6px;padding:2px 5px;border-radius:99px;background:#ede9fe;color:#6d28d9}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:8px;border-bottom:1px solid #eef0f4;text-align:right}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}.pos{color:#16a34a}.neg{color:#dc2626}@media(max-width:650px){.wrap{padding:12px}}
</style></head><body><div class="wrap"><div class="top"><h1 style="margin:0">🗂️ D / A 歷史快照</h1><a class="btn" href="./index.html">← 今日 Dashboard</a><a class="btn" href="./backtest.html">📈 回測 / Edge</a><label>日期 <select id="day"><option>讀取中...</option></select></label><span id="meta" class="muted"></span></div><div class="card tabs"><button id="D" class="primary on">D 技術強勢</button><button id="A">A 原始多因子</button></div><div class="card"><div class="scroll"><table><thead><tr><th>Rank</th><th>股票</th><th>市場</th><th>題材</th><th>總分</th><th>SAR</th><th>收盤</th><th>股本(億)</th><th>成交額(億)</th><th>外資</th><th>投信</th><th>RS20</th><th>RVOL</th><th>5D</th><th>20D</th><th>訊號</th></tr></thead><tbody id="tb"><tr><td colspan="16">尚無資料</td></tr></tbody></table></div></div></div><script>
var DATA=null,MODEL="D";function F(x,n){var v=Number(x);return Number.isFinite(v)?v.toFixed(n==null?2:n):"—"}function P(x){return Number.isFinite(Number(x))?F(x)+"%":"—"}function C(x){return Number(x)>=0?"pos":"neg"}function E(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function render(){var xs=DATA&&DATA.models&&DATA.models[MODEL]||[];document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("on",b.id===MODEL)});tb.innerHTML=xs.length?xs.map(function(x,i){return "<tr><td><b>"+(i+1)+"</b></td><td><b>"+E(x.code)+" "+E(x.name)+"</b></td><td>"+E(x.market)+"</td><td title='"+E(x.theme||"")+"'>"+E(x.theme||"—")+"</td><td><b>"+F(x.total==null?x.score:x.total,0)+"</b></td><td>"+E(x.sarText||"—")+"</td><td>"+F(x.close)+"</td><td>"+F(x.capitalB==null?x.capital:x.capitalB)+"</td><td>"+F(x.turnoverB==null?x.turnover:x.turnoverB)+"</td><td class='"+C(x.foreignToday)+"'>"+F(x.foreignToday,0)+"</td><td class='"+C(x.trustToday)+"'>"+F(x.trustToday,0)+"</td><td class='"+C(x.rs20)+"'>"+P(x.rs20)+"</td><td>"+F(x.rvol)+"</td><td class='"+C(x.ret5)+"'>"+P(x.ret5)+"</td><td class='"+C(x.ret20)+"'>"+P(x.ret20)+"</td><td>"+E(x.signal||"")+"</td></tr>"}).join(""):"<tr><td colspan='16'>該模型無股票</td></tr>"}
async function load(date){try{var r=await fetch("./data/daily/"+date+".json?"+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);DATA=await r.json();meta.textContent="資料日 "+(DATA.dataDate||date)+" ｜ Risk "+(DATA.risk&&DATA.risk.score!=null?DATA.risk.score:"—")+" "+(DATA.risk&&DATA.risk.state||"")+" ｜ 更新 "+(DATA.generatedAt||"--");render()}catch(e){meta.textContent="讀取失敗："+e.message}}
async function init(){try{var r=await fetch("./data/daily/index.json?"+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);var xs=await r.json();day.innerHTML="";xs.forEach(function(x){var o=document.createElement("option");o.value=x.date;o.textContent=x.date+"｜Risk "+(x.riskScore==null?"—":x.riskScore)+"｜D"+(x.dCount||0)+"/A"+(x.aCount||0);day.appendChild(o)});if(xs.length)load(xs[0].date);else day.innerHTML="<option>尚無歷史快照</option>"}catch(e){day.innerHTML="<option>載入失敗</option>"}}
["D","A"].forEach(function(id){document.getElementById(id).onclick=function(){MODEL=id;render()}});day.addEventListener("change",function(){load(day.value)});init();
</script></body></html>
