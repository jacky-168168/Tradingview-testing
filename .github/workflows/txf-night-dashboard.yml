name: TX Futures Day Night Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/src/futures_night.py'
      - '.github/workflows/txf-night-dashboard.yml'
  schedule:
    - cron: '35 7 * * 1-5'
    - cron: '40 21 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: txf-night-snapshot
  cancel-in-progress: false
jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Validate official TX same-session, same-contract matching
        shell: bash
        run: |
          PYTHONPATH=tw-stock-dashboard/src python - <<'PY'
          from futures_night import day_from_openapi,night_from_html,build
          from datetime import datetime
          from zoneinfo import ZoneInfo
          api=[
           {"Date":"20261008","Contract":"TX","ContractMonth(Week)":"202610","Last":"49349","Volume":"36039","TradingSession":"一般"},
           {"Date":"20261008","Contract":"TX","ContractMonth(Week)":"202610","Last":"49593","Volume":"29306","TradingSession":"盤後"},
           {"Date":"20261008","Contract":"TX","ContractMonth(Week)":"202611","Last":"49700","Volume":"15","TradingSession":"一般"}]
          day=day_from_openapi(api)
          assert day["close"]==49349 and day["contract"]=="202610",day
          html="""<html><body>2026/10/08 15:00~次日05:00 盤後交易時段行情表
          <table class="table_f"><tr><th>契約</th></tr>
          <tr><td>TX</td><td>202610</td><td>49122</td><td>49226</td>
          <td>48413</td><td>48705</td><td>▼-652</td><td>▼-1.32%</td><td>39441</td></tr></table>
          </body></html>"""
          night=night_from_html(html,"2026-10-08","202610","2026-10-12")
          assert night and night["close"]==48705 and night["officialChangePoints"]==-652,night
          assert night_from_html(html,"2026-10-07","202610","2026-10-12") is None
          assert night_from_html(html,"2026-10-08","202611","2026-10-12") is None
          result=build(day,night,datetime.now(ZoneInfo("Asia/Taipei")))
          assert result["nightVsDayPoints"]==-644 and result["officialNightChangePoints"]==-652,result
          print("PASS holiday crossover TX day=49349, night=48705, day delta=-644, official settlement delta=-652")
          PY
      - name: Fetch official TAIFEX completed sessions
        working-directory: tw-stock-dashboard
        run: PYTHONPATH=src python src/futures_night.py
      - name: Archive dated TX futures snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/futures/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: official TX futures day and afterhours market preview"
            for n in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && break
              git rebase --abort || true
              if [ "$n" = 4 ]; then exit 1; fi
              sleep 5
            done
          fi
  deploy:
    needs: fetch-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tw-stock-dashboard/docs
      - name: Deploy market dashboard with TX futures
        id: deployment
        uses: actions/deploy-pages@v4
