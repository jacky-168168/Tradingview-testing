name: TX Futures Day Night Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/src/futures_night.py'
      - 'tw-stock-dashboard/src/futures_preopen.py'
      - '.github/workflows/txf-night-dashboard.yml'
  schedule:
    # TX starts real trading at 08:45 Taipei; quote checks at 08:50/08:58,
    # with recovery after the 09:00 cash-market opening. GitHub cron best-effort.
    - cron: '50,58 0 * * 1-5'
    - cron: '8,25,45 1 * * 1-5'
    - cron: '5,35 2-5 * * 1-5'
    # Completed after-hours report: 05:15, 05:40, 05:45,
    # 06:15, 07:15, 08:15, 09:15 Asia/Taipei.
    # UTC Friday night = Taipei Saturday morning; keep Fri nights.
    # Recheck after exchange publication instead of fabricating 05:00 closes.
    - cron: '35 7 * * 1-5'
    - cron: '15,40,45 21 * * 1-5'
    - cron: '15 22,23 * * 1-5'
    - cron: '15 0,1 * * 2-6'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: txf-night-snapshot
  cancel-in-progress: false
jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Validate official TX same-session, same-contract matching
        shell: bash
        run: |
          PYTHONPATH=tw-stock-dashboard/src python - <<'PY'
          from futures_night import day_from_openapi,day_from_html,night_from_html,build
          from datetime import datetime
          from zoneinfo import ZoneInfo
          api=[
           {"Date":"20261008","Contract":"TX","ContractMonth(Week)":"202610","Last":"49349","Volume":"36039","TradingSession":"一般"},
           {"Date":"20261008","Contract":"TX","ContractMonth(Week)":"202610","Last":"49593","Volume":"29306","TradingSession":"盤後"},
           {"Date":"20261008","Contract":"TX","ContractMonth(Week)":"202611","Last":"49700","Volume":"15","TradingSession":"一般"}]
          day=day_from_openapi(api)
          assert day["close"]==49349 and day["contract"]=="202610",day
          dayhtml="""<div>2026/10/16 08:45~13:45 一般交易時段行情表</div>
          <table class="table_f"><tr><td>TX</td><td>202610</td><td>47228</td><td>47634</td>
          <td>47140</td><td>47242</td><td>311</td><td>0.66%</td><td>41283</td>
          <td>63312</td><td>104595</td><td>47284</td></tr></table>"""
          rescued=day_from_html(dayhtml,"2026-10-16","202610")
          assert rescued and rescued["date"]=="20261016" and rescued["close"]==47242 and rescued["volume"]==63312,rescued
          assert day_from_html(dayhtml,"2026-10-15","202610") is None
          html="""<html><body>2026/10/08 15:00~次日05:00 盤後交易時段行情表
          <table class="table_f"><tr><th>契約</th></tr>
          <tr><td>TX</td><td>202610</td><td>49122</td><td>49226</td>
          <td>48413</td><td>48705</td><td>▼-652</td><td>▼-1.32%</td><td>39441</td></tr></table>
          </body></html>"""
          night=night_from_html(html,"2026-10-08","202610","2026-10-12")
          assert night and night["close"]==48705 and night["officialChangePoints"]==-652,night
          assert night_from_html(html,"2026-10-07","202610","2026-10-12") is None
          assert night_from_html(html,"2026-10-08","202611","2026-10-12") is None
          result=build(day,night,datetime.now(ZoneInfo("Asia/Taipei")))
          assert result["nightVsDayPoints"]==-644 and result["officialNightChangePoints"]==-652,result
          # 2026-10-21 is TX October expiry: next morning 08:45 trades the NOV contract.
          rollover=[
           {"Date":"20261021","Contract":"TX","ContractMonth(Week)":"202610","Last":"46648","Volume":"23455","TradingSession":"一般"},
           {"Date":"20261021","Contract":"TX","ContractMonth(Week)":"202611","Last":"46992","Volume":"40515","TradingSession":"一般"},
           {"Date":"20261021","Contract":"TX","ContractMonth(Week)":"202612","Last":"47178","Volume":"261","TradingSession":"一般"}]
          selected=day_from_openapi(rollover)
          assert selected["contract"]=="202611" and selected["close"]==46992,selected
          html_roll="""<div>2026/10/21 08:45~13:45 一般交易時段行情表</div>
          <table class="table_f">
          <tr><td>TX</td><td>202610</td><td>47240</td><td>47288</td><td>46596</td><td>46648</td><td>307</td><td>0.66%</td><td>30400</td><td>23455</td><td>53855</td><td>-</td></tr>
          <tr><td>TX</td><td>202611</td><td>47388</td><td>47450</td><td>46872</td><td>46992</td><td>482</td><td>1.04%</td><td>8063</td><td>40515</td><td>48578</td><td>47013</td></tr></table>"""
          recovered=day_from_html(html_roll,"2026-10-21","202610")
          assert recovered and recovered["contract"]=="202611",recovered
          print("PASS TX expiry rollover 20261021 -> 202611, matched both OpenAPI and HTML")
          print("PASS holiday crossover TX day=49349, night=48705, day delta=-644, official settlement delta=-652")
          PY
      - name: Verify same-day quote parser rejects stale/auction quotes
        working-directory: tw-stock-dashboard
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_futures_preopen.py' -v
      - name: Verify same-day TX quote appears on homepage without rendering failure
        run: node tw-stock-dashboard/tests/test_txf_live_ui.cjs
      - name: Verify reopen after market holidays never inherits old TX risk baseline
        run: |
          node tw-stock-dashboard/tests/test_tx_holiday_open.cjs
          node tw-stock-dashboard/tests/test_market_open_breadth.cjs
      - name: Fetch verified TX same-day quote (08:45+ only)
        working-directory: tw-stock-dashboard
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: PYTHONPATH=src python -u src/futures_preopen.py
      - name: Fetch official TAIFEX completed sessions (independent of live quote)
        working-directory: tw-stock-dashboard
        run: PYTHONPATH=src python src/futures_night.py
      - name: Archive dated TX futures snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/futures/latest.json tw-stock-dashboard/docs/data/futures/intraday.json
          if ! git diff --cached --quiet; then
            git commit -m "data: official TX futures day and afterhours market preview"
            for n in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && break
              git rebase --abort || true
              if [ "$n" = 4 ]; then exit 1; fi
              sleep 5
            done
          fi
  deploy:
    needs: fetch-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tw-stock-dashboard/docs
      - name: Deploy market dashboard with TX futures
        id: deployment
        uses: actions/deploy-pages@v4
