name: Verify G 2026 TP3 SL10 Archive
on:
  push:
    branches: [feature/2026-g-tp3-sl10-archive]
  pull_request:
    paths:
      - '.github/workflows/verify-g-tp-sl-archive.yml'
      - 'tw-stock-dashboard/docs/backtest.html'
      - 'tw-stock-dashboard/docs/backtest-research.js'
      - 'tw-stock-dashboard/docs/data/research/model_execution_2026/g_tp_sl_2026_*.json'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse front-end JavaScript
        run: node --check tw-stock-dashboard/docs/backtest-research.js
      - name: Verify all 108 cases / preserved UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,math
          root=Path("tw-stock-dashboard/docs")
          data=root/"data/research/model_execution_2026"
          s=json.loads((data/"g_tp_sl_2026_summary.json").read_text())
          curves=json.loads((data/"g_tp_sl_2026_equity_curves.json").read_text())
          assert s["period"]=={"start":"2026-01-01","end":"2026-10-07"}
          assert s["archived7_15Checks"]["cashPortfolioParityN"]==36
          assert s["sourceModels"]=={"G_STRICT":541,"G_DOUBLE_PERSIST":490}
          n=0
          for sel,modes in s["statistics"].items():
            for mode,gates in modes.items():
              for gate,rules in gates.items():
                assert set(rules)=={"tp3_sl10","tp5_sl10","tp7_sl15"}
                for rule,by_slots in rules.items():
                  for slots,x in by_slots.items():
                    n+=1
                    assert x["maxConcurrentReservations"]<=int(slots)
                    assert x["filled"]<=x["admitted"]
                    d=curves["daily"][sel][mode][gate][rule][slots]
                    assert len(d)>175
                    assert math.isclose((d[-1]["equity"]/1e6-1)*100,x["totalReturnPct"],abs_tol=0.001)
          assert n==108,n
          # fixed reference G_STRICT top3, signal MA20, ladder, ten slots
          z=s["statistics"]["G_STRICT"]["ladder"]["signal_ma20"]
          assert z["tp3_sl10"]["10"]["filled"]==163
          assert z["tp7_sl15"]["10"]["filled"]==160
          assert z["tp3_sl10"]["10"]["totalReturnPct"]==9.201
          assert z["tp7_sl15"]["10"]["totalReturnPct"]==28.825
          html=(root/"backtest.html").read_text()
          js=(root/"backtest-research.js").read_text()
          for k in ("g","h","risk","timing","capacity","tp"):
            assert 'data-archive="'+k+'"' in html,k
          for k in ("g_tp_sl_2026_summary.json","g_tp_sl_2026_equity_curves.json","selectTPSensitivity","data-tp-selector","selectCapacity","selectTimingTrades"):
            assert k in js,k
          print("PASS 108 TP/SL portfolio cases, original 36 reproduced, all existing tabs retained")
          PY
