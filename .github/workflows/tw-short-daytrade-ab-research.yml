name: TW Short Daytrade A B Research Pilot

on:
  pull_request:
    paths:
      - 'tw-stock-dashboard/research/short_daytrade_ab_2026.py'
      - '.github/workflows/tw-short-daytrade-ab-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tw-short-daytrade-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public historical OHLCV data reader
        run: python -m pip install 'yfinance>=0.2.65,<2' 'requests>=2.31,<3' 'pandas>=2.1,<3'
      - name: Backtest engine self check (no market data invented)
        run: python tw-stock-dashboard/research/short_daytrade_ab_2026.py --self-test
      - name: Pull REAL historical 5-minute bars and daily legal eligibility when accessible
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -u tw-stock-dashboard/research/short_daytrade_ab_2026.py --output /tmp/tw-short-ab/pilot.json
      - name: Check evidence and print only observed numbers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/tw-short-ab/pilot.json')
          assert p.exists(),'No real market-data research output; do not invent metrics'
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['researchStatus']=='exploratory_5minute_backtest_not_deployable'
          assert not x['assessment']['gatedResearch']
          assert x['lookback']['symbolsWithCompleteFiveMinuteData']<=x['lookback']['countUniverse']
          for k in ('A_weak_continuation','B_failed_breakout'):
              m=x['results'][k]
              print('MODE',k)
              print('   FULL_PILOT',json.dumps(m['allConditional'],ensure_ascii=False))
              print('   LATER_PERIOD',json.dumps(m['laterPeriod'],ensure_ascii=False))
              print('   QUALIFIED_ONLY',json.dumps(m['exchangeQualifiedOnly'],ensure_ascii=False))
              print('   UNKNOWN_ELIGIBILITY',m['unknownEligibilityCount'])
              assert m['integrationReady'] is False
          print('AUTHENTIC_5M_STOCKS',x['lookback']['symbolsWithCompleteFiveMinuteData'])
          print('STUDY_NOT_APPROVED_FOR_PRODUCTION')
          PY
      - name: Upload audit-only report for review, not to GitHub Pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-short-daytrade-ab-authentic-5m-pilot
          path: /tmp/tw-short-ab/pilot.json
          if-no-files-found: warn
          retention-days: 14
