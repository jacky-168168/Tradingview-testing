name: QLD 2018-2026 2x SMA10 VWMA5 Backtest
on:
  push:
    branches: [research/qld-2018-2026-sma10-vwma5]
    paths:
      - 'tw-stock-dashboard/src/research_qld_2018_2026.py'
      - '.github/workflows/qld-2018-2026-sma-vwma.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: qld-2018-2026-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            qqq-vt-2018-2026-${{ runner.os }}-
            00675l-vwma-sma-2018-${{ runner.os }}-
      - name: Install research packages
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Backtest QLD daily 2x across 2018-2026
        working-directory: tw-stock-dashboard
        run: |
          python -m py_compile src/research_qld_2018_2026.py
          python -u src/research_qld_2018_2026.py
      - name: Validate 9 years and fully compounded USD cash-account
        working-directory: tw-stock-dashboard
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path("docs/data/research/qld_sma10_vwma5_2018_2026")
          s=json.loads((p/"summary.json").read_text())
          e=json.loads((p/"daily_equity_and_orders.json").read_text())
          assert s["ticker"]=="QLD" and s["startingCapitalTWD"]==1000000
          assert s["period"]==["2018-01-02","2026-10-07"]
          assert s["USSessions"]>=2150 and len(s["strategies"])==6
          assert {r["id"] for r in s["strategies"]}=={"BUY_HOLD_QLD","QLD_SMA10","QLD_VWMA5","QLD_VWMA5_ALT_1_2","QQQ_SIGNAL_SMA10","QQQ_SIGNAL_VWMA5"}
          for r in s["strategies"]:
            eq=e["simulations"][r["id"]]["dailyEquityUSD"]
            orders=e["simulations"][r["id"]]["ordersUSD"]
            assert len(eq)==s["USSessions"]
            assert eq[0]["date"]=="2018-01-02" and eq[-1]["date"]=="2026-10-07"
            assert r["riskOffSells"]==r["riskOnReentries"]
            assert set(r["yearByYearCompounded"])==set(str(y) for y in range(2018,2027))
            assert math.isclose(eq[-1]["equity"],r["endUSD"],abs_tol=.05)
            assert math.isclose(r["endUSD"]*s["conversion"]["lastFX"],r["endTWD"],abs_tol=1)
            assert len(orders)>0
          assert s["executionModel"]["US_ETF_SellTaxPct"]==0
          assert s["executionModel"]["brokerFeeEachSidePct"]>0
          assert all(s["priceData"][z+"PositiveVolumeDaysPct"]>=99 for z in ("QLD","QQQ"))
          print("PASS: all 6 QLD hold/rotation signals, 2203 sessions, 9-year full account equity, FX conversion, US ETF fee model")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: QLD-2018-2026-daily-compounding-and-executions
          path: tw-stock-dashboard/docs/data/research/qld_sma10_vwma5_2018_2026/*.json
      - name: Store complete backtest results to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/research/qld_sma10_vwma5_2018_2026/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive validated QLD 2018-2026 full-compound backtest"
            git push origin HEAD:research/qld-2018-2026-sma10-vwma5
          fi
