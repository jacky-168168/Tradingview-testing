name: Verify TAIFEX Official TX Day-Night Website Parser
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-txf-official-html.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4
      - name: Probe dated official futures reports for 2026-10-08
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          url='https://www.taifex.com.tw/cht/3/futDailyMarketReport'
          params={'queryType':'2','marketCode':'0','dateaddcnt':'','commodity_id':'TX','commodity_id2':'','queryDate':'2026/10/08','MarketCode':'1','commodity_idt':'TX','commodity_id2t':''}
          for verb,market in [('POST','0'),('POST','1'),('GET','1'),('POST','night'),('GET','night')]:
              p=dict(params);p['MarketCode']=market
              if market=='night':p['marketCode']='1';p['MarketCode']='1'
              try:
                  r=requests.post(url,data=p,timeout=30) if verb=='POST' else requests.get(url,params=p,timeout=30)
                  soup=BeautifulSoup(r.text,'html.parser')
                  title=soup.title.get_text(' ',strip=True) if soup.title else ''
                  hits={t:('YES' if t in r.text else 'no') for t in ['48,705','48705','49,593','49593','2026/10/08','15:00','盤後','table_f']}
                  tb=soup.select_one('table.table_f')
                  trs=tb.select('tr') if tb else []
                  snippets=[re.sub(r'\\s+',' ',tr.get_text(' ',strip=True))[:450] for tr in trs[:6]]
                  print(verb,market,'status',r.status_code,'bytes',len(r.content),'title',title,'hits',hits,'tabletrs',len(trs),'tableheads',snippets,'response_start',r.text[:150].replace('\\n',' '))
                  if verb=='POST' and market=='0':
                      for f in soup.find_all('form'):
                          print('FORM',f.get('id'),f.get('name'),f.get('method'),f.get('action'))
                          for inp in f.select('input,select'):
                              if inp.name=='input':
                                  print('INPUT',inp.get('name'),inp.get('type'),str(inp.get('value',''))[:120])
                              elif inp.name=='select':
                                  print('SELECT',inp.get('name'),[(o.get('value'),o.get_text(' ',strip=True),bool(o.has_attr('selected'))) for o in inp.select('option')][:20])
                      for txt in ['一般交易時段','盤後交易時段','marketCode','MarketCode','queryDate','queryType']:
                          i=r.text.find(txt);print('HTML_CTX',txt,r.text[max(0,i-350):i+350].replace('\\n',' ') if i>=0 else 'not found')

              except Exception as e: print(verb,market,'ERROR',type(e).__name__,str(e)[:200])
          print("DATE WALK")
          for dt in ['2026/10/07','2026/10/08','2026/10/09','2026/10/10','2026/10/12']:
              p=dict(params);p.update({'marketCode':'1','MarketCode':'1','queryDate':dt})
              try:
                  r=requests.get(url,params=p,timeout=25);soup=BeautifulSoup(r.text,'html.parser')
                  h=' '.join(soup.get_text(' ',strip=True).split())
                  tbody=soup.select_one('table.table_f')
                  tx=[]
                  if tbody:
                      for tr in tbody.select('tr'):
                          cells=[q.get_text(' ',strip=True) for q in tr.select('td')]
                          if cells and cells[0]=='TX':tx.append(cells[:11])
                  print('NIGHT_FOR',dt,'tx',tx[:2],'has_48705',('48705' in r.text),'info',h[-260:])
              except Exception as e:print('FAIL NIGHT_FOR',dt,str(e))
          print("OPEN API LAST DATES")
          try:
              api=requests.get('https://openapi.taifex.com.tw/v1/DailyMarketReportFut',timeout=40).json()
              matches=[{'Date':v.get('Date'),'TradingSession':v.get('TradingSession'),'Contract':v.get('Contract'),'Month':v.get('ContractMonth(Week)'),'Last':v.get('Last'),'Volume':v.get('Volume')} for v in api if v.get('Contract')=='TX' and v.get('ContractMonth(Week)')=='202610' and v.get('Date','')>='20261007']
              print('OPEN_API_TX',matches[:25])
          except Exception as e: print('OPEN_API_FAIL',e)
          PY
