name: Verify TAIFEX Official TX Day-Night Website Parser
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-txf-official-html.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4
      - name: Probe dated official futures reports for 2026-10-08
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          url='https://www.taifex.com.tw/cht/3/futDailyMarketReport'
          params={'queryType':'2','marketCode':'0','dateaddcnt':'','commodity_id':'TX','commodity_id2':'','queryDate':'2026/10/08','MarketCode':'1','commodity_idt':'TX','commodity_id2t':''}
          for verb,market in [('POST','0'),('POST','1'),('GET','1')]:
              p=dict(params);p['MarketCode']=market
              try:
                  r=requests.post(url,data=p,timeout=30) if verb=='POST' else requests.get(url,params=p,timeout=30)
                  soup=BeautifulSoup(r.text,'html.parser')
                  title=soup.title.get_text(' ',strip=True) if soup.title else ''
                  hits={t:('YES' if t in r.text else 'no') for t in ['48,705','48705','49,593','49593','2026/10/08','15:00','盤後','table_f']}
                  tb=soup.select_one('table.table_f')
                  trs=tb.select('tr') if tb else []
                  snippets=[re.sub(r'\\s+',' ',tr.get_text(' ',strip=True))[:450] for tr in trs[:6]]
                  print(verb,market,'status',r.status_code,'bytes',len(r.content),'title',title,'hits',hits,'tabletrs',len(trs),'tableheads',snippets,'response_start',r.text[:150].replace('\\n',' '))
              except Exception as e: print(verb,market,'ERROR',type(e).__name__,str(e)[:200])
          PY
