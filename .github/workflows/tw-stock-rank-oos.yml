name: TW Stock Rank OOS Diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/.rank-oos-trigger'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tw-stock-rank-oos
  cancel-in-progress: false
jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore market cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Install
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Run rank diagnostics 2023-2025
        working-directory: tw-stock-dashboard
        run: |
          set -e
          python src/backtest.py --start 2023-01-01 --end 2023-12-31
          python src/backtest.py --start 2024-01-01 --end 2024-12-31
          python src/backtest.py --start 2025-01-01 --end 2025-12-31
          cp docs/data/backtest/2026-01-01_2026-10-07.json docs/data/backtest/latest.json
      - name: Commit OOS rank diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/backtest/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Add 2023-2025 Top20 rank diagnostics"
            ok=0
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || { git rebase --abort || true; sleep $((i*10)); continue; }
              if git push origin HEAD:main; then ok=1; break; fi
              sleep $((i*10))
            done
            [ "$ok" -eq 1 ] || exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tw-stock-dashboard/docs
      - uses: actions/deploy-pages@v4
