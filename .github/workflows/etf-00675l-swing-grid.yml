name: 00675L Expanded Swing Grid 2024-2026
on:
  push:
    branches: [research/00675l-swing-grid-2024-2026]
    paths:
      - 'tw-stock-dashboard/src/research_00675l_swing_grid.py'
      - '.github/workflows/etf-00675l-swing-grid.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore Taiwan market cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: 00675l-swing-grid-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            00675l-walk-${{ runner.os }}-
            tp-sl-3-10-g-2026-${{ runner.os }}-
            g-capacity-2026-${{ runner.os }}-
            tw-stock-cache-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Compile and run expanded swing backtest
        working-directory: tw-stock-dashboard
        run: |
          python -m py_compile src/research_00675l_swing_grid.py
          python src/research_00675l_swing_grid.py
      - name: Verify frozen 2026 validation and data integrity
        working-directory: tw-stock-dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,math
          p=Path("docs/data/research/etf_00675l_grid_2024_2026")
          s=json.loads((p/"summary.json").read_text())
          t=json.loads((p/"oos_trades_and_equity.json").read_text())
          train=json.loads((p/"all_train_variants.json").read_text())
          assert s["ticker"]=="00675L.TW"
          assert s["universe"]["total"]>=500
          assert len(train["training"])==s["universe"]["total"]
          assert s["universe"]["eligible"]>=30
          assert s["trainBest"]["id"]==s["trainTop30"][0]["id"]
          assert len(s["familyWinners"])>=5
          assert "BUY_HOLD" in {x["id"] for x in s["validation"]}
          assert len(t["frozenCandidates"])==len(s["validation"])
          for z in t["frozenCandidates"]:
            curve=z["dailyEquity"];test=z["2026"]
            assert len(curve)==test["sessions"] and len(curve)>170
            assert all(x["buyDate"]>="2026-01-01" for x in z["events"])
            assert math.isclose((curve[-1]["equity"]/1_000_000-1)*100,test["returnPct"],abs_tol=.001)
            assert z["id"] in {a["id"] for a in train["training"]}
          print("PASS: 2024-25 training-only rank, 2026 fixed selected family validation, N =",len(s["validation"]))
          PY
      - name: Upload complete study
        uses: actions/upload-artifact@v4
        with:
          name: 00675l-expanded-swing-2024-2026
          path: tw-stock-dashboard/docs/data/research/etf_00675l_grid_2024_2026/*.json
          retention-days: 30
      - name: Freeze study on isolated research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/research/etf_00675l_grid_2024_2026/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive 00675L expanded train/validation grid"
            git push origin HEAD:research/00675l-swing-grid-2024-2026
          fi
