name: H5 Five-Tranche Ladder 2026 Research
on:
  push:
    branches: [research/h5-ladder-five-orders-2026]
    paths:
      - '.github/workflows/tw-stock-h5-ladder.yml'
      - 'tw-stock-dashboard/src/h5_ladder.py'
      - 'tw-stock-dashboard/src/backtest_h_ladder.py'
      - 'tw-stock-dashboard/tests/test_h5_ladder.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore stock history cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Dependencies
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Test H5 unchanged selection and ladder execution
        working-directory: tw-stock-dashboard
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/h5_ladder.py src/backtest_h_ladder.py tests/test_h5_ladder.py
          python -m unittest discover -s tests -p test_h5_ladder.py -v
      - name: Evaluate 2026 2/2.5/3pct 5-entry averaging and plus7 minus15
        working-directory: tw-stock-dashboard
        run: python src/backtest_h_ladder.py
      - name: Save detailed results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: h5-ladder-2026-five-entries
          path: tw-stock-dashboard/docs/data/backtest_h_ladder/*.json
          retention-days: 30
