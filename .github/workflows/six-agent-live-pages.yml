name: Six Agent Live Pages Verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/six-agent-live-pages.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/six-agent-live-pages.yml'
      - 'tw-stock-dashboard/docs/agent-research*'
      - 'tw-stock-dashboard/docs/index.html'
  workflow_run:
    workflows: ['TW Stock Pages']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: six-agent-live-pages
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert production page, JS assets and homepage entry resolve
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          from time import sleep
          urls={
            "page":"https://jacky-168168.github.io/Tradingview-testing/agent-research.html",
            "core":"https://jacky-168168.github.io/Tradingview-testing/agent-research-core.js",
            "ui":"https://jacky-168168.github.io/Tradingview-testing/agent-research-ui.js",
            "home":"https://jacky-168168.github.io/Tradingview-testing/index.html",
          }
          expected={"page":"六代理研究實驗室",
                    "core":"SixAgentResearch",
                    "ui":"SixAgentResearch",
                    "home":'href="./agent-research.html"'}
          # Github Pages CDN may need a short propagation interval after deploy.
          for attempt in range(1,10):
            try:
              for k,u in urls.items():
                with urlopen(Request(u,headers={"User-Agent":"Six-Agent-Pages-Verification/1.0",
                        "Cache-Control":"no-cache"}),timeout=20) as res:
                  raw=res.read(3_000_000).decode("utf-8")
                  if res.status!=200 or expected[k] not in raw:
                    raise RuntimeError(f"{k} HTTP {res.status}, expected marker missing")
                print("LIVE_PAGE_OK",k,len(raw))
              print("SIX_AGENT_LIVE_VERIFIED")
              break
            except (HTTPError,URLError,TimeoutError,RuntimeError) as exc:
              print(f"ATTEMPT {attempt}: {type(exc).__name__}: {exc}")
              if attempt==9:raise
              sleep(10)
          PY
