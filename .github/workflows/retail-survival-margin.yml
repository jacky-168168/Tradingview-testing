name: Retail Survival Margin Chart
# TWSE public-derived fallback verified separately from third-party historical series.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retail-survival-margin.yml'
      - 'tw-stock-dashboard/scripts/retail_tpex.py'
      - 'tw-stock-dashboard/scripts/retail_twse_fallback.py'
      - 'tw-stock-dashboard/scripts/update_retail_survival.py'
      - 'tw-stock-dashboard/tests/test_retail_tpex.py'
      - 'tw-stock-dashboard/tests/test_retail_twse_freshness.py'
      - 'tw-stock-dashboard/scripts/check_retail_survival_freshness.py'
      - 'tw-stock-dashboard/tests/test_retail_survival_freshness.py'
  workflow_dispatch:
  schedule:
    # Official margin reports can arrive after market close. Extra independent
    # retry slots reduce exposure to one missing GitHub scheduled event.
    # Asia/Taipei: 17:35, 19:35, 21:35, 22:20, 23:20, weekdays only.
    - cron: '35 9,11,13 * * 1-5'
    - cron: '20 14,15 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: retail-survival-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.2
      - name: Validate official TPEx parsing and safety conditions
        run: python -m unittest discover -s tw-stock-dashboard/tests -p 'test_retail_tpex.py' -v
      - name: Test margin freshness and late-source safeguards
        run: python -m unittest discover -s tw-stock-dashboard/tests -p 'test_retail_survival_freshness.py' -v
      - name: Validate same-day official TWSE balance and quote integrity
        run: python -m unittest discover -s tw-stock-dashboard/tests -p 'test_retail_twse_freshness.py' -v
      - name: Refresh TWSE and TPEx official margin maintenance and validated TAIEX OHLC
        run: python tw-stock-dashboard/scripts/update_retail_survival.py
      - name: Check data integrity
        run: |
          python - <<'PY'
          import json,datetime,pathlib
          p=pathlib.Path('tw-stock-dashboard/docs/data/retail_survival/latest.json')
          d=json.loads(p.read_text('utf-8'))
          a=d['rows']
          assert len(a)>=12 and a==sorted(a,key=lambda r:r['date'])
          assert d['asOf']==a[-1]['date']
          assert all(3000<r['indexClose']<100000 and any(75<r.get(k,0)<400 for k in ('listed','otc','overall') if isinstance(r.get(k),(int,float))) for r in a)
          last=a[-1]
          if all(isinstance(last.get(k),(int,float)) for k in ('listed','otc','overall')):
              total=round((last['listedCollateralTwd']+last['otcCollateralTwd'])/(last['listedLoanTwd']+last['otcLoanTwd'])*100,2) if all(k in last for k in ('listedCollateralTwd','otcCollateralTwd','listedLoanTwd','otcLoanTwd')) else None
              if total is not None:assert abs(last['overall']-total)<0.011
          assert a[-1]['date']<=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).date().isoformat()
          print('retail_survival validated:',d['asOf'],'days:',len(a))
          PY
      - name: Reject yesterday's or incomplete margin ratio after verified market close
        run: python tw-stock-dashboard/scripts/check_retail_survival_freshness.py
      - name: Commit new market observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/retail_survival/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update sourced retail survival margin history"
            ok=0
            for attempt in 1 2 3 4; do
              git pull --rebase -X theirs origin main || { git rebase --abort || true; sleep 5; continue; }
              if git push origin HEAD:main; then ok=1; break; fi
              sleep 6
            done
            [ "$ok" = 1 ] || exit 1
          else
            git pull --ff-only origin main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tw-stock-dashboard/docs
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify deployed margin data is not older
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          from pathlib import Path
          old=json.loads(Path('tw-stock-dashboard/docs/data/retail_survival/latest.json').read_text('utf-8'))
          req=urllib.request.Request(os.environ['SITE'].rstrip('/')+'/data/retail_survival/latest.json?v='+str(time.time()),headers={'Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=25) as f:
              data=json.loads(f.read())
          assert data['asOf']>=old['asOf'], 'Pages margin JSON behind repository'
          print('Published retail survival:',data['asOf'])
          PY
