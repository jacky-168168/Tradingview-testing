name: 00675L Frozen 2020-2026 Full Market Cycle Backtest
on:
  push:
    branches: [research/00675l-extended-2020-2026]
    paths:
      - 'tw-stock-dashboard/src/research_00675l_extended_2020_2026.py'
      - '.github/workflows/etf-00675l-extended-2020-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Recover Yahoo ETF and Taiwan Index history
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: 00675l-2020-2026-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            00675l-near-bh-${{ runner.os }}-
            00675l-trend-capture-${{ runner.os }}-
            00675l-holdcompare-${{ runner.os }}-
            00675l-reinvest-${{ runner.os }}-
      - name: Install financial research dependencies
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Reproduce frozen 2020-2026 full account simulations
        working-directory: tw-stock-dashboard
        run: |
          python -m py_compile src/research_00675l_extended_2020_2026.py
          python src/research_00675l_extended_2020_2026.py
      - name: Verify no annual capital reset and complete market cycles
        working-directory: tw-stock-dashboard
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path("docs/data/research/etf_00675l_extended_2020_2026")
          s=json.loads((p/"summary.json").read_text())
          detail=json.loads((p/"daily_equity_orders.json").read_text())
          assert s["ticker"]=="00675L.TW" and s["sessions"]>=1600
          assert s["baseline"]["continuous"]["riskOffSells"]==0
          assert s["baseline"]["continuous"]["start"]>="2020-01-01"
          assert s["baseline"]["continuous"]["end"]<="2026-10-07"
          assert s["model"]["initialCapitalNTD"]==1000000
          assert len(s["comparison"])>=6
          for x in [s["baseline"]]+s["comparison"]:
            assert math.isfinite(x["continuous"]["returnPct"])
            assert math.isfinite(x["continuous"]["endNTD"])
            assert x["continuous"]["endNTD"]>0
            assert set(x["compoundedCalendarYears"])=={str(y) for y in range(2020,2027)}
            e=detail["cases"][x["id"]]["dailyAccountEquity"]
            assert len(e)==s["sessions"]
            assert math.isclose(e[-1]["equity"],x["continuous"]["endNTD"],abs_tol=.05)
            last=e[-1]["equity"]
            assert math.isclose(last,x["compoundedCalendarYears"]["2026"]["endNTD"],abs_tol=.05)
            assert math.isclose((last/1e6-1)*100,x["continuous"]["returnPct"],abs_tol=.002)
          assert set(s["stress"]["slippageEachSide"])=={"0.001","0.003","0.005","0.01"}
          assert set(s["stress"]["additionalDecisionSessionLag"])=={"0","1","2"}
          print("PASS: preserved 2020-2026 100萬 continuous equity, 7 annual slices, 9 portfolios, 4 slippage, 3 delay stress cases")
          PY
      - name: Upload full results
        uses: actions/upload-artifact@v4
        with:
          name: 00675l-2020-2026-all-market-phases-compounding
          path: tw-stock-dashboard/docs/data/research/etf_00675l_extended_2020_2026/*.json
          retention-days: 30
      - name: Freeze results on isolated research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/research/etf_00675l_extended_2020_2026/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive 00675L full market-cycle 2020-2026 frozen-rule backtest"
            git push origin HEAD:research/00675l-extended-2020-2026
          fi
