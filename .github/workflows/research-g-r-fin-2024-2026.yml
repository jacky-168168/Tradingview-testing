name: Audit G-R1-R4 and FinPilot S111 (research branch only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tw-stock-dashboard/src/research_g_r_fin_2024_2026.py'
      - 'tw-stock-dashboard/src/research_fin_s111_2025_2026.py'
      - '.github/workflows/research-g-r-fin-2024-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out research branch, not production
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore prior Yahoo OHLC parquet cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-g-r-fin-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-g-r-fin-cache-${{ runner.os }}-
            tw-stock-cache-${{ runner.os }}-
      - name: Install research dependencies
        run: |
          pip install -r tw-stock-dashboard/requirements.txt
          pip install beautifulsoup4
      - name: Syntax check
        run: |
          python -m py_compile tw-stock-dashboard/src/research_g_r_fin_2024_2026.py
          python -m py_compile tw-stock-dashboard/src/research_fin_s111_2025_2026.py
      - name: G, G-R1 to G-R4 2024-2026 live reconstruction
        id: g
        working-directory: tw-stock-dashboard
        run: python -u src/research_g_r_fin_2024_2026.py
      - name: S111 FinLab replay (fail-closed when historical BI unavailable)
        if: always()
        working-directory: tw-stock-dashboard
        env:
          FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
        run: |
          python -u src/research_fin_s111_2025_2026.py
      - name: Save results for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g-r1-r4-fin-audit
          path: tw-stock-dashboard/docs/data/research/g_r_fin_2024_2026/
          if-no-files-found: warn
      - name: Commit only research results to this branch
        if: steps.g.outcome == 'success' && github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/research/g_r_fin_2024_2026/
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish audited G-R1-R4 and Fin status on research branch'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
