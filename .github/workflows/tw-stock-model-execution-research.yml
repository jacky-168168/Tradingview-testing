name: Selectors vs Ladder/MA 2026 Research
on:
  push:
    branches: [research/model-selection-ladder-ma-2026]
    paths:
      - '.github/workflows/tw-stock-model-execution-research.yml'
      - 'tw-stock-dashboard/src/research_model_execution.py'
      - 'tw-stock-dashboard/tests/test_research_model_execution.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-models:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore 2026 market OHLC cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: selector-exec-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
            g-execution-cache-${{ runner.os }}-
      - name: Install requirements
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Verify selection sources and trade rules
        working-directory: tw-stock-dashboard
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/research_model_execution.py tests/test_research_model_execution.py
          python -m unittest discover -s tests -p 'test_research_model_execution.py' -v
          python -m unittest discover -s tests -p 'test_g_exec_comparison.py' -v
      - name: Fixed Top3 selection by ladder vs SMA touch
        working-directory: tw-stock-dashboard
        run: python src/research_model_execution.py
      - name: Archive complete research
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: model-selection-vs-ladder-ma-2026
          path: tw-stock-dashboard/docs/data/research/model_execution_2026/*.json
          retention-days: 30
