name: Official ROE PB Growth Research
on:
  workflow_dispatch:
    inputs:
      start:
        description: '官方 PB 起日 YYYY-MM-DD（歷史補檔分批跑）'
        required: true
        default: '2026-10-01'
      end:
        description: '官方 PB 迄日 YYYY-MM-DD'
        required: true
        default: '2026-10-09'
      run_roe:
        description: '收集2022–2026官方合併財報並重建ROE（資源密集）'
        type: boolean
        required: true
        default: false
      run_backtest:
        description: '同時執行成長／ROE-PB 歷史月度回測（資源密集）'
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '30 11 * * 1-5'
permissions:
  contents: write
concurrency:
  group: official-quality-archive
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Verify no future financial leakage
        working-directory: tw-stock-dashboard
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_stock_quality.py -v
          python -m unittest discover -s tests -p test_collect_roe_history.py -v
          python -m unittest discover -s tests -p test_quality_backtest.py -v
      - name: Collect official PB with incremental checkpoint
        working-directory: tw-stock-dashboard
        shell: bash
        run: |
          END="${{ inputs.end || '' }}"
          START="${{ inputs.start || '' }}"
          if [ -z "$END" ]; then END="$(TZ=Asia/Taipei date -d yesterday +%F)"; fi
          if [ -z "$START" ]; then START="$(TZ=Asia/Taipei date -d '7 days ago' +%F)"; fi
          python -u src/collect_pb_history.py --start "$START" --end "$END"
      - name: Collect MOPS quarterly TTM ROE provenance archive
        if: ${{ inputs.run_roe == true }}
        working-directory: tw-stock-dashboard
        run: python -u src/collect_roe_history.py --start-year 2023 --end-year 2026 --asof "$(TZ=Asia/Taipei date +%F)"
      - name: Backtest with verified official financial archives
        if: ${{ inputs.run_backtest == true }}
        working-directory: tw-stock-dashboard
        run: python -u src/research_fundamental_quality.py
      - name: Commit only archived, validated research data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/research/quality/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive official ROE-PB quality research"
          for i in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 10; continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 15
          done
          exit 1
