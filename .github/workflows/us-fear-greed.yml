name: WantGoo Fear Greed US Market Chart
on:
  workflow_dispatch:
  # Rebuild once the actual S&P 500 archive publisher finishes, preventing
  # a previous US session from being presented as the latest joined record.
  workflow_run:
    workflows: ["US DIX GEX Research and Snapshot"]
    types: [completed]
  schedule:
    # Taipei Tue-Sat 08:15, 10:15, 12:15, 14:15, 16:15.
    # Retries matter because WantGoo and the SPX archive have independent delays.
    - cron: '15 0,2,4,6,8 * * 2-6'
    # Taipei Mon-Fri 20:15: final catch-up / post-holiday audit.
    - cron: '15 12 * * 1-5'
  push:
    branches: [main, fix/wantgoo-fear-greed-source-20261022]
    paths:
      - 'tw-stock-dashboard/src/update_us_fear_greed.py'
      - 'tw-stock-dashboard/tests/test_us_fear_greed.py'
      - 'tw-stock-dashboard/tests/fear-greed-home.test.cjs'
      - '.github/workflows/us-fear-greed.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: wantgoo-fear-greed-research
  cancel-in-progress: false
jobs:
  update:
    # Ignore failed upstream runs; scheduled/manual retries remain available.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parser, dates and chart front-end
        run: |
          python -m py_compile tw-stock-dashboard/src/update_us_fear_greed.py
          PYTHONPATH=tw-stock-dashboard/src python -m unittest discover -s tw-stock-dashboard/tests -p 'test_us_fear_greed.py' -v
          node --check tw-stock-dashboard/docs/fear-greed-home.js
          node --test tw-stock-dashboard/tests/fear-greed-home.test.cjs
      - name: Refresh WantGoo observed sentiments and aligned SPX
        run: python -u tw-stock-dashboard/src/update_us_fear_greed.py
      - name: Validate source freshness and no fabricated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tw-stock-dashboard/docs/data/research/us_fear_greed/history.json')
          x=json.loads(p.read_text())
          assert x['version']=='US_WANTGOO_FEAR_GREED_SPX_V1'
          assert x['sourceLink']=='https://www.wantgoo.com/global/macroeconomics/fearandgreed'
          assert x['legacyCount']>=150 and x['wantgooCount']>=2
          assert x['wantgooHistoricalLast']==x['asOf']
          assert x['columns']==['date','fearGreed','spx']
          assert len(x['rows'])>=150
          assert x['rows'][-1][0]==x['asOf']
          assert len(set(r[0] for r in x['rows']))==len(x['rows'])
          print('WANTGOO_FEAR_GREED_VALID',x['asOf'],'rows',len(x['rows']))
          PY
      - name: Save verified historical data artifact
        uses: actions/upload-artifact@v4
        with:
          name: wantgoo-fear-greed-spx-history
          path: tw-stock-dashboard/docs/data/research/us_fear_greed/history.json
          retention-days: 90
      - name: Publish research snapshot on main only
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/research/us_fear_greed/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh verified WantGoo Fear Greed and S&P500'
            for i in 1 2 3; do
              git pull --rebase origin main || { git rebase --abort || true; sleep $((i*4)); continue; }
              if git push origin HEAD:main; then exit 0; fi
              sleep $((i*4))
            done
            exit 1
          fi
      - name: Verify latest checked-in record before deployment
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('tw-stock-dashboard/docs/data/research')
          fg=json.loads((root/'us_fear_greed/history.json').read_text('utf-8'))
          spx=json.loads((root/'us_options/history.json').read_text('utf-8'))
          assert fg['asOf']==fg['rows'][-1][0], 'fear & greed last date mismatch'
          assert spx['asOf']==fg['asOf'], 'Fear & Greed must match latest S&P 500 session before publishing'
          print('ALIGNED_FEAR_GREED_SPX',fg['asOf'],len(fg['rows']))
          PY
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload verified site snapshot
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: tw-stock-dashboard/docs
      - name: Deploy Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
      - name: Verify live Pages contains the newest dated Fear and Greed close
        run: |
          python - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          archive=Path("tw-stock-dashboard/docs/data/research/us_fear_greed/history.json")
          expected=json.loads(archive.read_text("utf-8"))
          url="https://jacky-168168.github.io/Tradingview-testing/data/research/us_fear_greed/history.json"
          observed="no response"
          for n in range(12):
              try:
                  req=urllib.request.Request(url+"?validate="+str(time.time_ns()),headers={"Cache-Control":"no-cache","User-Agent":"US-Fear-Greed-Pages-Date-Validator"})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      live=json.loads(response.read())
                  observed=str(live.get("asOf"))
                  if live.get("asOf")==expected["asOf"] and live.get("rows",[])[-1:]==expected["rows"][-1:]:
                      print("LIVE_FEAR_GREED_DATE_OK",observed,"source",live.get("sourceLink"))
                      break
              except (OSError,ValueError,KeyError,IndexError) as error:
                  observed=repr(error)
              print("LIVE_FEAR_GREED_DATE_NOT_UPDATED",n+1,"want",expected["asOf"],"got",observed,flush=True)
              time.sleep(10)
          else:
              raise SystemExit("GitHub Pages still serves older Fear and Greed than the latest published archive: expected="+expected["asOf"]+" observed="+observed)
          PY
