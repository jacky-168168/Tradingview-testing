name: WantGoo Fear Greed US Market Chart
on:
  workflow_dispatch:
  schedule:
    # Taipei Tue-Sat 08:15, 10:15, 12:15, 14:15, 16:15.
    # Retry independent WantGoo updates without waiting for another SPX provider.
    - cron: '15 0,2,4,6,8 * * 2-6'
    # Taipei Mon-Fri 20:15 catch-up and post-holiday check.
    - cron: '15 12 * * 1-5'
  push:
    branches: [main, fix/wantgoo-fear-greed-20261022]
    paths:
      - 'tw-stock-dashboard/src/update_us_fear_greed.py'
      - 'tw-stock-dashboard/tests/test_us_fear_greed.py'
      - 'tw-stock-dashboard/tests/fear-greed-home.test.cjs'
      - '.github/workflows/us-fear-greed.yml'
permissions:
  contents: write
concurrency:
  group: wantgoo-fear-greed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dated WantGoo HTML parser and browser chart
        run: |
          python -m py_compile tw-stock-dashboard/src/update_us_fear_greed.py
          PYTHONPATH=tw-stock-dashboard/src python -m unittest discover -s tw-stock-dashboard/tests -p 'test_us_fear_greed.py' -v
          node --check tw-stock-dashboard/docs/fear-greed-home.js
          node --test tw-stock-dashboard/tests/fear-greed-home.test.cjs
      - name: Fetch WantGoo dated sentiment and S&P 500
        run: python -u tw-stock-dashboard/src/update_us_fear_greed.py
      - name: Verify published provenance and dates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('tw-stock-dashboard/docs/data/research/us_fear_greed/history.json').read_text('utf-8'))
          assert x['version']=='US_WANTGOO_FEAR_GREED_SPX_V2'
          assert x['sourceLink']=='https://www.wantgoo.com/global/macroeconomics/fearandgreed'
          assert x['columns']==['date','fearGreed','spx']
          assert len(x['rows'])>=150
          assert x['rows'][-1][0]==x['asOf']==x['wantgooLast']==x['spxLast']
          assert len(set(r[0] for r in x['rows']))==len(x['rows'])
          assert x['legacyHistorySource'] and x['legacyThrough']
          print('WANTGOO_FEAR_GREED_VALID',x['wantgooLast'],'rows',len(x['rows']))
          PY
      - name: Save verifiable snapshot
        uses: actions/upload-artifact@v4
        with:
          name: wantgoo-fear-greed-spx-history
          path: tw-stock-dashboard/docs/data/research/us_fear_greed/history.json
          retention-days: 30
      - name: Publish changed WantGoo archive (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/research/us_fear_greed/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh dated WantGoo Fear Greed and S&P500 history'
            for i in 1 2 3; do
              git pull --rebase origin main || { git rebase --abort || true; sleep $((i*4)); continue; }
              if git push origin HEAD:main; then exit 0; fi
              sleep $((i*4))
            done
            exit 1
          fi
