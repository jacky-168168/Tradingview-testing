name: TPEx Upstream Industry Chain Stock Map
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/src/upstream_industries.py'
      - 'tw-stock-dashboard/tests/test_upstream_industries.py'
      - '.github/workflows/upstream-industry-map.yml'
  schedule:
    - cron: '15 11 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: upstream-industry-map
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore official company chain category cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache/upstream_company
          key: tpex-company-upstream-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tpex-company-upstream-${{ runner.os }}-
      - name: Install
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Verify deterministic TPEx upstream stage mapping and HTML parser
        working-directory: tw-stock-dashboard
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_upstream_industries.py -v
          node --check docs/upstream-industries.js
      - name: Build sector and upstream stock list from dated full-market archive
        working-directory: tw-stock-dashboard
        run: python -u src/upstream_industries.py
      - name: Validate dated sector JSON and push to main
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tw-stock-dashboard/docs/data/industry_upstream/latest.json')
          s=Path('tw-stock-dashboard/docs/data/stocks/latest.json')
          a=json.loads(p.read_text());b=json.loads(s.read_text())
          assert a['schema']=='tw-upstream-industries-v1' and a['dataDate']==b['dataDate']
          assert a['coverage']['verifiedCompanyPages']>=500 and a['coverage']['marketStocks']>=1000
          assert a['coverage']['distinctUpstreamStocks']>30
          assert len(a['industries'])==8
          assert all(z['source'].startswith('https://ic.tpex.org.tw/introduce.php?ic=') for z in a['industries'])
          assert all(x['market'] in ('上市','上櫃') and x['code'].isdigit() and len(x['code'])==4 for sector in a['industries'] for part in sector['subgroups'] for x in part['stocks'])
          print('PASS dated upstream stock map',a['dataDate'],a['coverage'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/industry_upstream/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish TPEx upstream industry stock map'
            ok=0
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main || { git rebase --abort || true; sleep $((i*8)); continue; }
              if git push origin HEAD:main; then ok=1; break; fi
              sleep $((i*9))
            done
            [ "$ok" -eq 1 ] || exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tw-stock-dashboard/docs
      - name: Deploy upstream industry page
        id: deployment
        uses: actions/deploy-pages@v4
