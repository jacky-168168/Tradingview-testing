name: TPEx Upstream Industry Chain Stock Map
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/src/upstream_industries.py'
      - 'tw-stock-dashboard/tests/test_upstream_industries.py'
      - '.github/workflows/upstream-industry-map.yml'
  schedule:
    - cron: '15 11 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: upstream-industry-map
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore official company chain category cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache/upstream_company
          key: tpex-company-upstream-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tpex-company-upstream-${{ runner.os }}-
      - name: Install
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Verify deterministic TPEx upstream stage mapping and HTML parser
        working-directory: tw-stock-dashboard
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_upstream_industries.py -v
          node --check docs/upstream-industries.js
          node tests/test_upstream_ui.cjs
      - name: Build sector and upstream stock list from dated full-market archive
        working-directory: tw-stock-dashboard
        run: python -u src/upstream_industries.py
      - name: Validate dated sector JSON and push to main
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tw-stock-dashboard/docs/data/industry_upstream/latest.json')
          s=Path('tw-stock-dashboard/docs/data/stocks/latest.json')
          a=json.loads(p.read_text());b=json.loads(s.read_text())
          assert a['schema']=='tw-upstream-industries-v2' and a['dataDate']==b['dataDate']
          assert a['coverage']['verifiedCompanyPages']>=500 and a['coverage']['marketStocks']>=1000
          assert a['coverage']['distinctUpstreamStocks']>30
          assert len(a['industries'])==11
          cpo=next(x for x in a['industries'] if x['code']=='CPO')
          assert cpo['name']=='CPO／矽光子' and cpo['stockCount']>=7 and len(cpo['subgroups'])==3
          assert 'trendforce.com.tw' in cpo['source'], 'CPO must be independent research, not fake TPEx industry'
          cpo_codes={x['code'] for g in cpo['subgroups'] for x in g['stocks']}
          assert {'3081','3163','3363','6442','4977','3450','4979'}.issubset(cpo_codes),f'Missing CPO core suppliers: {cpo_codes}'
          assert not {'2330','2317','2327'} & cpo_codes, 'Foundry / system OEM / unrelated passive stocks are not CPO optical upstream'
          assert all(x['basis']=='cpo_industry_research' and x.get('source','').startswith('https://') for g in cpo['subgroups'] for x in g['stocks'])
          print('PASS CPO research optical upstream',cpo['stockCount'],cpo_codes)
          semi=next(z for z in a['industries'] if z['code']=='D000')
          wafer=next(g for g in semi['subgroups'] if '半導體用矽晶圓' in g['name'])
          assert {'6488','3532','6182','3016'}.issubset({r['code'] for r in wafer['stocks']}), 'silicon wafer supplier audit incomplete'
          assert all(r['basis']=='independent_industry_material' and 'itis.org.tw' in r['source'] for r in wafer['stocks'])
          assert not any(r['code']=='2330' for g in semi['subgroups'] for r in g['stocks']), 'fab erroneously classified as upstream'
          solar=next(z for z in a['industries'] if z['code']=='A100')
          paste=next(g for g in solar['subgroups'] if '太陽能材料' in g['name'])
          k=next((r for r in paste['stocks'] if r['code']=='4760'),None)
          assert k and '非純太陽能股' in k['roleNote'] and k['basis']=='tpex_official', 'solar paste role missing'
          assert all(r.get('source') for sec in a['industries'] for group in sec['subgroups'] for r in group['stocks']), 'uncited company upstream placement'
          comm=next(z for z in a['industries'] if z['code']=='I000')
          c={g['name']:g for g in comm['subgroups']}
          assert '主動元件（光主動／晶片）' in c and '被動元件（電阻電容／濾波等）' in c and '待核對（官方混合分類）' in c
          assert not any(g['name']=='主／被動元件' for g in comm['subgroups'])
          active={x['code'] for x in c['主動元件（光主動／晶片）']['stocks']}
          passive={x['code'] for x in c['被動元件（電阻電容／濾波等）']['stocks']}
          pending={x['code'] for x in c['待核對（官方混合分類）']['stocks']}
          assert {'3081','3234','4908','4979','3450'}.issubset(active), f'optical active suppliers missing: {active}'
          assert {'2327','3026','2478','3221','3491','3152','6284'}.issubset(passive), f'passive suppliers missing: {passive}'
          assert not ({'2327','3081','3491'} & pending), 'verified products must not be pending'
          y=next(x for x in c['被動元件（電阻電容／濾波等）']['stocks'] if x['code']=='2327')
          assert y['basis']=='tpex_cross_industry' and '中游' in y['roleNote'] and y['source'].endswith('stk_code=2327')
          print('PASS communication main-passive split',len(active),len(passive),len(pending),'Yageo J000 midstream')
          assert all(z['source'].startswith('https://ic.tpex.org.tw/introduce.php?ic=') for z in a['industries'] if z['code'] not in {'CPO','LEO','IC_SUB'})
          assert all(x['market'] in ('上市','上櫃') and x['code'].isdigit() and len(x['code'])==4 for sector in a['industries'] for part in sector['subgroups'] for x in part['stocks'])
          pcb=next(z for z in a['industries'] if z['code']=='L000')
          groups={g['name']:g for g in pcb['subgroups']}
          assert {'2383','6213','6274'}.issubset({x['code'] for x in groups['銅箔基板 CCL／高速基材（中游延伸）']['stocks']})
          assert {'8021'}.issubset({x['code'] for x in groups['PCB 精密鑽針／鑽孔耗材（製程上游供應）']['stocks']})
          sub=next(z for z in a['industries'] if z['code']=='IC_SUB')
          sg={g['name']:g for g in sub['subgroups']}
          assert {'3037','8046','3189'}.issubset({x['code'] for x in sg['ABF／BT IC 載板製造（中游）']['stocks']})
          assert not {'3037','8046','3189'} & {x['code'] for x in sg['載板用樹脂／材料（上游跨應用）']['stocks']}
          leo=next(z for z in a['industries'] if z['code']=='LEO')
          assert {'3491','2313','2367','2383','6285'}.issubset({x['code'] for g in leo['subgroups'] for x in g['stocks']})
          assert all(x['basis']=='industry_theme_research' and x['source'].startswith('https://')
                     for z in a['industries'] for g in z['subgroups'] for x in g['stocks'] if x['basis']=='industry_theme_research')
          print('PASS official-vs-research stage separation and key PCB/LEO/substrate core suppliers')
          print('PASS dated upstream stock map',a['dataDate'],a['coverage'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/industry_upstream/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish TPEx upstream industry stock map'
            ok=0
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main || { git rebase --abort || true; sleep $((i*8)); continue; }
              if git push origin HEAD:main; then ok=1; break; fi
              sleep $((i*9))
            done
            [ "$ok" -eq 1 ] || exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tw-stock-dashboard/docs
      - name: Deploy upstream industry page
        id: deployment
        uses: actions/deploy-pages@v4
