name: LUNA Public Social Sentiment
on:
  workflow_dispatch:
  schedule:
    # UTC 01:10/03:10/05:10/09:10/13:10 = Taiwan 09:10/11:10/13:10/17:10/21:10.
    - cron: '10 1,3,5,9,13 * * *'
  pull_request:
    paths:
      - '.github/workflows/luna-social-sentiment.yml'
      - 'tw-stock-dashboard/scripts/collect_social_sentiment.py'
      - 'tw-stock-dashboard/tests/test_social_sentiment.py'
      - 'tw-stock-dashboard/docs/agent-research*'
      - 'tw-stock-dashboard/tests/test_six_agent_research.cjs'
permissions:
  contents: read
concurrency:
  group: luna-social-sentiment
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify sources, stale-data guards and independent six-agent rules
        run: |
          python -m unittest discover -s tw-stock-dashboard/tests -p 'test_social_sentiment.py' -v
          node --test tw-stock-dashboard/tests/test_six_agent_research.cjs
          node --check tw-stock-dashboard/docs/agent-research-core.js
          node --check tw-stock-dashboard/docs/agent-research-ui.js
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect verifiable public posts and authorized Meta sources
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: python tw-stock-dashboard/scripts/collect_social_sentiment.py
      - name: Reject fabricated sources, validate staleness and schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tw-stock-dashboard/docs/data/social_sentiment/latest.json')
          d=json.loads(p.read_text())
          assert d['schema']==1 and d['generatedAt'] and len(d['items'])<=80
          assert all(x['platform'] in {'PTT','Threads','Instagram'} and x['url'].startswith('https://') for x in d['items'])
          assert all(x['platform']=='新聞' for x in d['newsItems'])
          assert d['social']['sample']>=len(d['items'])
          print('SOCIAL_VALIDATED',d['sources'])
          PY
      - name: Publish research-only social JSON to Pages source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/social_sentiment/latest.json
          if git diff --cached --quiet; then echo 'No social data change'; exit 0; fi
          git commit -m 'data: update public LUNA social sentiment evidence [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          echo 'Social data publish failed; do not claim source is current' >&2
          exit 1
