name: LUNA Public Social Sentiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/luna-social-sentiment.yml'
      - 'tw-stock-dashboard/scripts/collect_social_sentiment.py'
      - 'tw-stock-dashboard/scripts/classify_luna_semantic.cjs'
      - 'tw-stock-dashboard/scripts/archive_luna_history.py'
  schedule:
    # UTC 01:10/03:10/05:10/09:10/13:10 = Taiwan 09:10/11:10/13:10/17:10/21:10.
    - cron: '10 1,3,5,9,13 * * *'
  pull_request:
    paths:
      - '.github/workflows/luna-social-sentiment.yml'
      - 'tw-stock-dashboard/scripts/collect_social_sentiment.py'
      - 'tw-stock-dashboard/tests/test_social_sentiment.py'
      - 'tw-stock-dashboard/tests/test_luna_archive.py'
      - 'tw-stock-dashboard/tests/test_luna_semantic.cjs'
      - 'tw-stock-dashboard/scripts/classify_luna_semantic.cjs'
      - 'tw-stock-dashboard/scripts/archive_luna_history.py'
      - 'tw-stock-dashboard/docs/agent-research*'
      - 'tw-stock-dashboard/tests/test_six_agent_research.cjs'
permissions:
  contents: read
concurrency:
  group: luna-social-sentiment
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify sources, stale-data guards and independent six-agent rules
        run: |
          python -m unittest discover -s tw-stock-dashboard/tests -p 'test_social_sentiment.py' -v
          python -m unittest discover -s tw-stock-dashboard/tests -p 'test_luna_archive.py' -v
          node --test tw-stock-dashboard/tests/test_luna_semantic.cjs tw-stock-dashboard/tests/test_six_agent_research.cjs
          node --check tw-stock-dashboard/scripts/classify_luna_semantic.cjs
          node --check tw-stock-dashboard/docs/agent-research-core.js
          node --check tw-stock-dashboard/docs/agent-research-ui.js
      - name: Probe Bluesky public official API (PR diagnostics, non-blocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          from datetime import datetime,timezone
          p=Path("tw-stock-dashboard/scripts/collect_social_sentiment.py")
          s=importlib.util.spec_from_file_location("luna_probe",p)
          mod=importlib.util.module_from_spec(s);s.loader.exec_module(mod)
          try:
              rows=mod.bluesky(datetime.now(timezone.utc))
              print("BLUESKY_PUBLIC_PROBE",len(rows),"original public posts across",len(mod.BLUESKY_QUERIES),"queries")
          except Exception as err:
              print("BLUESKY_PUBLIC_PROBE_ERROR",type(err).__name__,str(err)[:160])
              raise
          PY
      - name: Probe public PTT Atom URL without credentials (PR only; diagnostic)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('tw-stock-dashboard/scripts/collect_social_sentiment.py')
          spec=importlib.util.spec_from_file_location('ptt_probe',p)
          obj=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(obj)
          from datetime import datetime,timezone
          rows,state=obj.collect_ptt(datetime.now(timezone.utc),obj.request)
          print('PUBLIC_PTT_PROBE',len(rows),state)
          assert rows, 'PTT official Atom and HTML fallback returned no checkable posts from past 48 hours'
          PY
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve previous semantic decisions for exact-source cache
        run: |
          cp tw-stock-dashboard/docs/data/social_sentiment/latest.json "$RUNNER_TEMP/luna-previous.json"
      - name: Collect verifiable public posts and authorized Meta sources
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_IDS: ${{ vars.FACEBOOK_PAGE_IDS }}
        run: python tw-stock-dashboard/scripts/collect_social_sentiment.py
      - name: Classify only new investment discussion via authorized Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LUNA_GEMINI_MODEL: gemini-3.5-flash-lite
          LUNA_PREVIOUS_PATH: ${{ runner.temp }}/luna-previous.json
        run: node tw-stock-dashboard/scripts/classify_luna_semantic.cjs
      - name: Update daily verifiable LUNA research archive
        run: python tw-stock-dashboard/scripts/archive_luna_history.py
      - name: Reject fabricated sources, validate staleness and schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tw-stock-dashboard/docs/data/social_sentiment/latest.json')
          d=json.loads(p.read_text())
          assert d['schema']==1 and d['generatedAt'] and len(d['items'])<=80
          assert all(x['platform'] in {'PTT','Threads','Instagram','Bluesky'} and x['url'].startswith('https://') for x in d['items'])
          assert all(x['platform']=='新聞' for x in d['newsItems'])
          reposts=d.get('pttNewsItems',[])
          assert isinstance(reposts,list) and len(reposts)<=40
          assert all(x['platform']=='PTT' and x['contentType']=='新聞轉載' and
                     x['investmentEligible'] is False and x['url'].startswith('https://www.ptt.cc/bbs/Stock/')
                     for x in reposts)
          assert len({x['url'] for x in reposts})==len(reposts)
          assert all('pushScore' not in x or isinstance(x['pushScore'],int) for x in reposts)
          media=d.get('creatorMedia',[])
          assert isinstance(media,list) and len(media)<=70
          assert all(x['platform'] in {'YouTube','Facebook'} and x['url'].startswith('https://') and x.get('title') and x.get('publishedAt') for x in media)
          assert all(x['url'].startswith('https://www.youtube.com/watch?v=') if x['platform']=='YouTube' else
                     x['url'].startswith(('https://facebook.com/','https://www.facebook.com/','https://m.facebook.com/')) for x in media)
          assert all(d['sources'][source]['freshCount']==sum(x['platform']==source for x in media)
                     for source in ('YouTube','Facebook') if d['sources'][source]['status'] in {'ok','empty'})
          assert all(x['platform'] not in {'YouTube','Facebook'} for x in d['items'])
          assert d['social']['rawSample']==len(d['items'])
          assert d['social']['sample']<=d['social']['rawSample']
          assert d['social']['investmentDiscussion']+d['social']['repostedNews']+d['social']['unrelated']==len(d['items'])
          assert sum(bool(x.get('investmentEligible')) for x in d['items'])==d['social']['investmentDiscussion']
          sem=d.get('semantic',{})
          assert sem.get('status') in {'empty','cached','verified','partial','error','unavailable'}
          assert sem.get('noTrade') is True and sem.get('inferenceCalls',0)>=0
          assert sem.get('classifiedCount',0)<=sem.get('candidateCount',0)
          assert all(not x.get('semantic') or x.get('investmentEligible') is True for x in d['items'])
          h=Path('tw-stock-dashboard/docs/data/social_sentiment/history/index.json')
          index=json.loads(h.read_text('utf-8'))
          assert index['schema']==1 and index['days'] and index['retentionDays']==30
          print('LUNA_SEMANTIC_ARCHIVE_VERIFIED',sem['status'],sem.get('inferenceCalls'),len(index['days']))
          assert isinstance(d.get("stockHeat"),dict)
          assert all(x["sample"]>=1 and x["sample"]<=len(d["items"]) and x["recent24h"]<=x["sample"] for x in d["stockHeat"]["stocks"])
          assert all(x["sample"]>=x["originalDiscussion"]>=0 for x in d["stockHeat"]["stocks"])
          print('SOCIAL_VALIDATED',d['sources'])
          PY
      - name: Publish research-only social JSON to Pages source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A tw-stock-dashboard/docs/data/social_sentiment/
          if git diff --cached --quiet; then echo 'No social data change'; exit 0; fi
          git commit -m 'data: append LUNA research history and Gemini semantic audit [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          echo 'Social data publish failed; do not claim source is current' >&2
          exit 1
