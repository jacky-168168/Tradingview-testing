name: G 2026 3D18D Market Controls
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/.g-multiday-controls-trigger'
permissions:
  contents: write
jobs:
  peer_patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Compare bullish engulf on 3D and 18D against market peers
        working-directory: tw-stock-dashboard
        run: python src/research_multiday_controls.py
      - name: Save peer-control research JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/research/g_multiday_controls_2026.json
          if ! git diff --cached --quiet; then
            git commit -m "2026 3D18D engulf comparison to strong-stock market peers"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
