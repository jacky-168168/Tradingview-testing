name: G Top3 Ladder vs MA 2026 Research
on:
  push:
    branches: [research/g-top3-ladder-vs-ma-2026]
    paths:
      - '.github/workflows/tw-stock-g-execution-compare.yml'
      - 'tw-stock-dashboard/src/backtest_g_exec_comparison.py'
      - 'tw-stock-dashboard/tests/test_g_exec_comparison.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g-execution-research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore historical daily OHLC cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: g-execution-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Dependencies
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Verify execution invariants
        working-directory: tw-stock-dashboard
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/backtest_g_exec_comparison.py tests/test_g_exec_comparison.py
          python -m unittest discover -s tests -p 'test_g_exec_comparison.py' -v
      - name: Test G_DOUBLE_PERSIST frozen Top3 with ladder versus moving average
        working-directory: tw-stock-dashboard
        run: python src/backtest_g_exec_comparison.py
      - name: Archive G research results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: g-top3-ladder-vs-ma-2026
          path: tw-stock-dashboard/docs/data/backtest_g_exec/*.json
          retention-days: 30
