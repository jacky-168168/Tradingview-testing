name: G Market Low-Buy High-Sell Three-Year Study
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/src/research_g_regime_contrarian.py'
      - 'tw-stock-dashboard/tests/test_g_regime_contrarian.py'
      - '.github/workflows/research-g-regime-contrarian.yml'
permissions:
  contents: write
concurrency:
  group: research-g-contrarian
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore historical Yahoo prices
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Install
        run: |
          pip install -r tw-stock-dashboard/requirements.txt
          pip install beautifulsoup4
      - name: Validate contrarian no-lookahead and transaction ledger
        run: |
          python -m py_compile tw-stock-dashboard/src/research_g_regime_contrarian.py
          PYTHONPATH=tw-stock-dashboard/src python -m unittest discover -s tw-stock-dashboard/tests -p 'test_g_regime_contrarian.py' -v
          PYTHONPATH=tw-stock-dashboard/src python -m unittest discover -s tw-stock-dashboard/tests -p 'test_g_pro_round2.py' -v
      - name: Verify official daily TWII archive and run market contrarian comparison
        working-directory: tw-stock-dashboard
        run: python -u src/research_g_regime_contrarian.py
      - name: Audit results for correctness and complete history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tw-stock-dashboard/docs/data/research/g_regime_contrarian_3y')
          s=json.loads((p/'summary.json').read_text(encoding='utf-8'))
          t=json.loads((p/'trades.json').read_text(encoding='utf-8'))
          e=json.loads((p/'equity.json').read_text(encoding='utf-8'))
          assert s['riskScoredDays']==728 and s['marketDays']==728
          assert s['stockDataErrors']==0 and len(s['grid'])==144
          assert len(t['models'])==144
          assert any(x['entry']=="LTE40" and x['exit']=="HOLD20" for x in s['grid'])
          assert any(x['entry']=="GTE60" and x['exit']=="GTE70_HALF_80_ALL" for x in s['grid'])
          assert all(x['portfolio']['finalEquity']>0 for x in s['grid'])
          assert all(x['portfolio']['dailyMaxDrawdownPct']<=0 for x in s['grid'])
          assert all(len(z['dates'])==728 and len(z['equity'])==728 for z in e['models'].values())
          assert sum(s['marketDistribution']['modeCounts'].values())==728
          print("G_MARKET_CONTRARIAN_AUDIT_PASS",s['modelSelection'])
          PY
      - name: Publish score and state market-timing results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/research/g_regime_contrarian_3y/
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish dated low-score entry and high-score exit comparison'
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || { git rebase --abort || true; sleep $((i*7)); continue; }
              if git push origin HEAD:main; then exit 0; fi
              sleep $((i*7))
            done
            exit 1
          fi
