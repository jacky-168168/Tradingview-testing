name: Market Intelligence Snapshot and Rules Verification
on:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/src/market_intelligence.py'
      - 'tw-stock-dashboard/tests/test_market_intelligence.py'
      - '.github/workflows/market-intelligence.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-intelligence-research
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic anti-lookahead and state tests
        run: |
          python -m py_compile tw-stock-dashboard/src/market_intelligence.py
          python -u tw-stock-dashboard/tests/test_market_intelligence.py
      - name: Generate risk explanation for latest completed official session
        run: python -u tw-stock-dashboard/src/market_intelligence.py
      - name: Publish risk research diagnostics (no production gate mutation)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/research/market_intelligence/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: date-locked market intelligence diagnostic preview'
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || { git rebase --abort || true; sleep $((i*6)); continue; }
              if git push origin HEAD:main; then exit 0; fi
              sleep $((i*6))
            done
            exit 1
          fi
