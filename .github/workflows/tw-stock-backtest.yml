name: TW Stock Backtest
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '開始日期 YYYY-MM-DD；留空=最近180天'
        required: false
        default: ''
      end_date:
        description: '結束日期 YYYY-MM-DD；留空=今天'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/tw-stock-backtest.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tw-stock-dashboard
  cancel-in-progress: false
jobs:
  backtest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore market cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Install
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Resolve backtest range
        id: range
        shell: bash
        run: |
          START="${{ inputs.start_date || '' }}"
          END="${{ inputs.end_date || '' }}"
          if [ -z "$END" ]; then END="$(date -u +%F)"; fi
          if [ -z "$START" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              START="$(date -u -d '30 days ago' +%F)"
            else
              START="$(date -u -d '180 days ago' +%F)"
            fi
          fi
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "Backtest: $START -> $END"
      - name: Run A/D range backtest
        working-directory: tw-stock-dashboard
        run: python src/backtest.py --start '${{ steps.range.outputs.start }}' --end '${{ steps.range.outputs.end }}'
      - name: Commit backtest JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/backtest/*.json
          git diff --cached --quiet || git commit -m "Update A/D backtest ${{ steps.range.outputs.start }} to ${{ steps.range.outputs.end }}"
          git push
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tw-stock-dashboard/docs
      - uses: actions/deploy-pages@v4
        id: deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
