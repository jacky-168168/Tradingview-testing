name: TW Stock Backtest
on:
  workflow_dispatch:
    inputs:
      period:
        description: '回測區間'
        required: true
        type: choice
        options:
          - 最近30天
          - 最近90天
          - 最近180天
          - 今年以來
          - 自訂日期
        default: 最近30天
      start_date:
        description: '自訂開始日 YYYY-MM-DD（只有選自訂日期才填）'
        required: false
        default: ''
      end_date:
        description: '自訂結束日 YYYY-MM-DD（自訂日期可填；留空=今天）'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/.f2-final-closed-session-smoke'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tw-stock-dashboard
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore market cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Install
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Resolve backtest range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            PERIOD="F2_FINAL_CLOSED_SESSION"
            START="2026-01-01"
            END="2026-10-08"
          else
            PERIOD="${{ inputs.period || '最近30天' }}"
            START="${{ inputs.start_date || '' }}"
            END="${{ inputs.end_date || '' }}"
            if [ -z "$END" ]; then END="$(TZ=Asia/Taipei date +%F)"; fi
            case "$PERIOD" in
              最近30天) START="$(date -u -d "$END - 30 days" +%F)" ;;
              最近90天) START="$(date -u -d "$END - 90 days" +%F)" ;;
              最近180天) START="$(date -u -d "$END - 180 days" +%F)" ;;
              今年以來) START="$(date -u -d "$END" +%Y)-01-01" ;;
              自訂日期) if [ -z "$START" ]; then echo "自訂日期需要填 start_date"; exit 1; fi ;;
            esac
          fi
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "Backtest: $START -> $END ($PERIOD)"
      - name: Run A/D/F/F2 range backtest
        working-directory: tw-stock-dashboard
        run: python src/backtest.py --start '${{ steps.range.outputs.start }}' --end '${{ steps.range.outputs.end }}'
      - name: Commit backtest JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/backtest/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Update A/D/F/F2 backtest ${{ steps.range.outputs.start }} to ${{ steps.range.outputs.end }}"
            ok=0
            for i in 1 2 3 4 5; do
              echo "Push attempt $i/5"
              git pull --rebase origin main || { git rebase --abort || true; sleep $((i*10)); continue; }
              if git push origin HEAD:main; then ok=1; break; fi
              sleep $((i*10))
            done
            if [ "$ok" -ne 1 ]; then echo "Failed to push backtest result after 5 attempts"; exit 1; fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tw-stock-dashboard/docs
      - uses: actions/deploy-pages@v4
        id: deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
