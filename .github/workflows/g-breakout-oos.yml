name: G Breakout OOS Backtest
on:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/.g-backtest-trigger'
permissions:
  contents: write
jobs:
  gtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore market cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Install
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Run G 2023-2026
        working-directory: tw-stock-dashboard
        run: |
          set -e
          python src/backtest_signal_model.py --start 2023-01-01 --end 2023-12-31
          python src/backtest_signal_model.py --start 2024-01-01 --end 2024-12-31
          python src/backtest_signal_model.py --start 2025-01-01 --end 2025-12-31
          python src/backtest_signal_model.py --start 2026-01-01 --end 2026-10-07
      - name: Commit G backtests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/backtest_g/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Run G breakout OOS backtests"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
