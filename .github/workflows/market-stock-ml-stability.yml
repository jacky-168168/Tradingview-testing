name: Bootstrap GRU vs Official Risk G D Stock Outcomes
on:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/research/market_stock_ml_stability.py'
      - '.github/workflows/market-stock-ml-stability.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproducible monthly-regime equivalent 20-session block-bootstrap
        run: |
          python -m py_compile tw-stock-dashboard/research/market_stock_ml_stability.py
          python -u tw-stock-dashboard/research/market_stock_ml_stability.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('tw-stock-dashboard/docs/data/research/market_stock_ml_oos/stability_bootstrap.json').read_text())
          assert len(r['results'])==8
          assert all(x['fixedPolicies']['GRU_AND_SCORE60']['selected']['samples']>0 for x in r['results'])
          print('PASS: resampled clustered trading dates without touching official Risk Score')
          PY
      - name: Preserve risk-model stability report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/research/market_stock_ml_oos/stability_bootstrap.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: 2025-2026 G D breadth GRU excess-return clustered stability'
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((i*5))
          done
          exit 1
