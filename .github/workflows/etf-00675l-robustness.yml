name: 00675L EMA10 Reclaim Robustness Audit
on:
  push:
    branches: [research/00675l-swing-grid-2024-2026]
    paths:
      - 'tw-stock-dashboard/src/research_00675l_robustness.py'
      - '.github/workflows/etf-00675l-robustness.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore source historical prices
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: 00675l-robustness-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            00675l-swing-grid-${{ runner.os }}-
            00675l-walk-${{ runner.os }}-
            tp-sl-3-10-g-2026-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Stress test slippage delay and adjacent exit rules
        working-directory: tw-stock-dashboard
        run: |
          python -m py_compile src/research_00675l_robustness.py
          python src/research_00675l_robustness.py
      - name: Verify baseline cross-run parity and stress levels
        working-directory: tw-stock-dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("docs/data/research/etf_00675l_grid_2024_2026/robustness.json")
          r=json.loads(p.read_text())
          assert r["referenceParity"]["2026"]["returnPct"]==66.445
          assert r["referenceParity"]["2026"]["maxDrawdownPct"]==-9.231
          assert len(r["localSensitivity"]["variants"])==30
          assert set(r["slippageStudy"]["stats"])=={"0.001","0.003","0.005","0.01"}
          assert set(r["executionDelayStudy"]["stats"])=={"0","1","2"}
          for z in r["localSensitivity"]["variants"]:
            for y in ("2024","2025","2026"):
              assert z[y]["trades"]>=0
          print("PASS: 00675L stress parity, 4 slippage settings, 3 entry delays and 30 sensitivity neighbors")
          PY
      - name: Upload study output
        uses: actions/upload-artifact@v4
        with:
          name: 00675l-ema10-stress-audit
          path: tw-stock-dashboard/docs/data/research/etf_00675l_grid_2024_2026/robustness.json
      - name: Archive independent robustness report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/research/etf_00675l_grid_2024_2026/robustness.json
          if ! git diff --cached --quiet; then
            git commit -m "research: persist 00675L EMA10 swing friction/delay stress report"
            git push origin HEAD:research/00675l-swing-grid-2024-2026
          fi
