name: Published Author Signals Realized Outcomes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/src/research_author_signal_outcomes.py'
      - '.github/workflows/research-author-outcomes.yml'
permissions:
  contents: write
jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Install requirements
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Verify and evaluate 19 original signals D+1 only
        working-directory: tw-stock-dashboard
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile src/research_author_signal_outcomes.py
          python -u src/research_author_signal_outcomes.py
      - name: Assert sample count and historical price coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tw-stock-dashboard/docs/data/research/author_breakout/author_outcomes.json')
          j=json.loads(p.read_text(encoding='utf-8'))
          assert j['sampleCount']==19 and j['dataCoverage']>=16
          assert set(j['plans'])=={'hold20_stop_only','twoR_fiveR','fiveR_tenR'}
          print('VALIDATED original author signals D+1',j['dataCoverage'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-author-original-outcomes
          path: tw-stock-dashboard/docs/data/research/author_breakout/author_outcomes.json
          retention-days: 30
      - name: Publish verified original signals outcomes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/research/author_breakout/author_outcomes.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish verified 19 author signal trade outcomes'
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || { git rebase --abort || true; sleep $((i*7)); continue; }
              if git push origin HEAD:main; then exit 0; fi
              sleep $((i*7))
            done
            exit 1
          fi
