name: D vs E Revenue 365-Day Research
on:
  push:
    branches:
      - research/e-revenue-mom-yoy-one-year
    paths:
      - '.github/workflows/tw-stock-e-revenue.yml'
      - 'tw-stock-dashboard/src/revenue_monthly.py'
      - 'tw-stock-dashboard/src/backtest_e.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore market cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Install
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Validate monthly revenue parsing and timing
        working-directory: tw-stock-dashboard
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_revenue_e.py' -v
      - name: Fetch 2025-2026 MOPS and run D vs E backtest
        working-directory: tw-stock-dashboard
        run: python src/backtest_e.py --start 2025-10-08 --end 2026-10-07
      - name: Publish research output as artifact (not production dashboard)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: d-vs-e-revenue-one-year
          path: tw-stock-dashboard/docs/data/backtest_e/*.json
          retention-days: 30
