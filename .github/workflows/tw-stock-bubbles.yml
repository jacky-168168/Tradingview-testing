name: TW Stock Bubbles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/src/bubbles.py'
      - 'tw-stock-dashboard/docs/bubbles.html'
      - '.github/workflows/tw-stock-bubbles.yml'
  schedule:
    - cron: '0 11 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tw-stock-bubbles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore market cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Install
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Build capital bubbles
        working-directory: tw-stock-dashboard
        run: python src/bubbles.py
      - name: Commit bubble JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/bubbles/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Update industry capital bubbles"
            ok=0
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || { git rebase --abort || true; sleep $((i*10)); continue; }
              if git push origin HEAD:main; then ok=1; break; fi
              sleep $((i*10))
            done
            [ "$ok" -eq 1 ] || exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tw-stock-dashboard/docs
      - uses: actions/deploy-pages@v4
