name: H5 Predetermined Next Day Pullback Limits
on:
  push:
    branches: [research/h-v5-limit-pullback-2026]
    paths:
      - '.github/workflows/tw-stock-h-v5.yml'
      - 'tw-stock-dashboard/src/backtest_h_v5.py'
      - 'tw-stock-dashboard/tests/test_h_v5.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  h5:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        offset: ["0","-1","-2","-3"]
    env:
      H5_LIMIT_OFFSET: ${{ matrix.offset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore stock cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}-${{ matrix.offset }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Install
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Validate limit order rules
        working-directory: tw-stock-dashboard
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/backtest_h_v5.py tests/test_h_v5.py
          python -m unittest discover -s tests -p test_h_v5.py -v
      - name: H5 2026 year research for offset
        working-directory: tw-stock-dashboard
        run: python src/backtest_h_v5.py
      - name: Archive result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: H5_2026_limit_offset_${{ matrix.offset }}
          path: tw-stock-dashboard/docs/data/backtest_h_v5/*.json
          retention-days: 30
