name: US DIX GEX Research and Snapshot
on:
  workflow_dispatch:
  schedule:
    # Taipei 07:20 and 19:20; delayed after-market publication is accepted.
    - cron: '20 23,11 * * 1-5'
  push:
    branches:
      - main
      - 'research/**'
    paths:
      - 'tw-stock-dashboard/src/update_us_options.py'
      - '.github/workflows/us-options-risk.yml'
permissions:
  contents: write
concurrency:
  group: us-options-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh verified US close and TWII backtest
        run: python tw-stock-dashboard/src/update_us_options.py
      - name: Verify snapshot and embargoed out-of-sample report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("tw-stock-dashboard/docs/data/research/us_options")
          latest=json.loads((root/"latest.json").read_text())
          report=json.loads((root/"backtest.json").read_text())
          assert latest["date"] == report["usSourceEnd"]
          assert report["samples"] >= 1500
          assert "strictly before" in report["lagPolicy"]
          assert "oos_2022_2023" in report["groups"]
          print("DIX/GEX latest + TWII out-of-sample verified:",latest["date"],report["samples"])
          PY
      - name: Publish research data only if source values changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/research/us_options/latest.json tw-stock-dashboard/docs/data/research/us_options/backtest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update delayed DIX GEX and TWII research"
            git push
          fi
