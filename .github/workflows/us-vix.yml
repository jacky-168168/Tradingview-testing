name: US Cboe VIX Daily Chart
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/us-vix.yml'
      - 'tw-stock-dashboard/src/us_vix.py'
      - 'tw-stock-dashboard/docs/vix-home.js'
  schedule:
    # US Mon-Fri closes become available during TW Tue-Sat mornings.
    # 08:20, 10:20, 13:20 Taiwan time (UTC+8).
    - cron: '20 0,2,5 * * 2-6'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: us-cboe-vix-daily-chart
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate parser with offline fixtures
        working-directory: tw-stock-dashboard
        run: python -m unittest discover -s tests -p 'test_us_vix.py' -v
      - name: Fetch official Cboe daily closing data
        working-directory: tw-stock-dashboard
        run: python src/us_vix.py
      - name: Verify output and last observations
        working-directory: tw-stock-dashboard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/data/research/us_vix/history.json')
          j = json.loads(p.read_text('utf-8'))
          assert j['version']=='CBOE_VIX_DAILY_V1'
          assert 'VIX' in j['series'] and len(j['series']['VIX']['rows'])>=30
          for symbol, info in j['series'].items():
              assert info['rows'][-1][0] == info['lastDate'], symbol
              print(symbol, info['lastDate'], len(info['rows']))
          print('Data errors (if any):',j.get('errors',{}))
          PY
      - name: Publish verified daily data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/research/us_vix/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official Cboe daily VIX history'
            ok=0
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main || { git rebase --abort || true; sleep $((i*5)); continue; }
              if git push origin HEAD:main; then ok=1; break; fi
              sleep $((i*5))
            done
            [ "$ok" -eq 1 ] || exit 1
          else
            git pull --ff-only origin main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload latest site snapshot
        uses: actions/upload-pages-artifact@v3
        with:
          path: tw-stock-dashboard/docs
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
