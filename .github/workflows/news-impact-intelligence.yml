name: Global Market News Impact
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/news-impact/**'
      - '.github/workflows/news-impact-intelligence.yml'
  schedule:
    # 08:27 / 20:27 Taipei. Scheduled Actions are best-effort, not real-time.
    - cron: '27 0,12 * * *'

permissions:
  contents: write

concurrency:
  group: news-impact-archive-main
  cancel-in-progress: false

jobs:
  archive-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test news-impact sector classifier and mobile script dependencies
        run: |
          node tw-stock-dashboard/news-impact/test_sector.cjs
          node tw-stock-dashboard/news-impact/test_freeze.cjs
      - name: Test archive timing and no-look-ahead
        run: python -m unittest discover -s tw-stock-dashboard/news-impact -p 'test_*.py' -v
      - name: Install market price provider
        run: python -m pip install --disable-pip-version-check 'yfinance>=0.2.60,<2'
      - name: Build event archive and price follow-through
        run: python tw-stock-dashboard/news-impact/history.py
      - name: Freeze prospective news directional signals
        run: node tw-stock-dashboard/news-impact/freeze_signals.cjs
      - name: Verify actual realized rule directions without hindsight
        run: python tw-stock-dashboard/news-impact/scorecard.py
      - name: Collect historical BLS releases and FOMC policy statements
        run: python tw-stock-dashboard/news-impact/collect_official_events.py
      - name: Build official-event historical study
        run: python tw-stock-dashboard/news-impact/official_study.py
      - name: Commit archive when updated
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/news_impact/ tw-stock-dashboard/news-impact/official_events_expanded.json
          if git diff --cached --quiet; then
            echo 'No archive changes'; exit 0
          fi
          git commit -m 'data(news-impact): refresh event archive and realized market moves'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            echo "push attempt $attempt failed"
            sleep 4
          done
          exit 1
