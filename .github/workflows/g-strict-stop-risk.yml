name: G_STRICT 2026 Stop Loss Diagnostic
on:
  push:
    branches: [research/g-strict-stoploss-risk-2026]
    paths:
      - '.github/workflows/g-strict-stop-risk.yml'
      - 'tw-stock-dashboard/src/research_g_strict_stop_risk.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore ^TWII data cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: stop-risk-market-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            selector-exec-cache-${{ runner.os }}-
            tw-stock-cache-${{ runner.os }}-
      - name: Install libs
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Validate source
        run: python -m py_compile tw-stock-dashboard/src/research_g_strict_stop_risk.py
      - name: Analyze independent stop reason classifications and market conditions
        working-directory: tw-stock-dashboard
        run: python src/research_g_strict_stop_risk.py
      - name: Save risk diagnostic
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: g-strict-stop-risk-analysis-2026
          path: tw-stock-dashboard/docs/data/research/model_execution_2026/g_strict_stop_diagnostic_2026.json
          retention-days: 30
