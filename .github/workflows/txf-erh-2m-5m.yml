name: TXF Extreme Reversal Trend70 2min vs 5min Historic Test
on:
  push:
    branches: [research/txf-extreme-reversal-trend70-2m-vs-5m]
    paths:
      - "tw-stock-dashboard/src/research_txf_erh_2m_5m.py"
      - ".github/workflows/txf-erh-2m-5m.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare-txf:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Install research runtime
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Download independent 2024 to 2026 one-minute TXF and replay causal 2/5min indicator events
        working-directory: tw-stock-dashboard
        run: |
          python -m py_compile src/research_txf_erh_2m_5m.py
          python -u src/research_txf_erh_2m_5m.py
      - name: Verify costed one-contract trades and identical 2m vs 5m dates
        working-directory: tw-stock-dashboard
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path("docs/data/research/txf_extreme_reversal_2m_5m_2025_2026")
          x=json.loads((p/"summary.json").read_text())
          y=json.loads((p/"trades_and_equity.json").read_text())
          assert x["cost"]["pointValueTWD"]==200
          assert x["cost"]["initialEquityTWD"]==1000000
          assert x["data"]["start"]=="2025-01-02"
          assert x["data"]["end"]=="2026-08-31"
          assert len(x["results"])==36 and len(y["cases"])==36
          assert set(q["timeframeMin"] for q in x["results"])=={2,5}
          assert all(q["firstBar"] and q["lastBar"] for q in x["results"])
          assert all(q["endingEquityTWD"]>0 for q in x["results"])
          assert all(q["trades"]>=0 for q in x["results"])
          assert x["data"]["dataQuality"][0]["dayTestBars"]>40000
          assert x["data"]["dataQuality"][1]["dayTestBars"]>16000
          print("PASS: 36 actual historic 2min/5min TXF variants across 2025/26; one TXF contract, taxes, slip and year-split audit")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TXF-Extreme-Reversal-Hunter-Trend70-2m-versus-5m
          path: tw-stock-dashboard/docs/data/research/txf_extreme_reversal_2m_5m_2025_2026/*.json
          retention-days: 90
      - name: Archive verified research on its independent branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/research/txf_extreme_reversal_2m_5m_2025_2026
          if ! git diff --cached --quiet; then
            git commit -m "research: TXF 2m and 5m real minute market signal backtest with fixed 1-lot costs"
            git push origin HEAD:research/txf-extreme-reversal-trend70-2m-vs-5m
          fi
