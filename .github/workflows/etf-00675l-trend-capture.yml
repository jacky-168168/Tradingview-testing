name: 00675L Trend Capture vs Buy Hold 2024-2026
on:
  push:
    branches: [research/00675l-trend-capture-2024-2026]
    paths:
      - 'tw-stock-dashboard/src/research_00675l_trend_capture.py'
      - '.github/workflows/etf-00675l-trend-capture.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore 00675L Yahoo history cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: 00675l-trend-capture-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            00675l-holdcompare-${{ runner.os }}-
            00675l-reinvest-${{ runner.os }}-
            00675l-swing-grid-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Run trend-preserving regime tests
        working-directory: tw-stock-dashboard
        run: |
          python -m py_compile src/research_00675l_trend_capture.py
          python src/research_00675l_trend_capture.py
      - name: Verify historical 100 percent invested benchmark and finalist parity
        working-directory: tw-stock-dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,math
          p=Path("docs/data/research/etf_00675l_trend_capture_2024_2026")
          s=json.loads((p/"summary.json").read_text())
          e=json.loads((p/"selected_daily_equity_orders.json").read_text())
          t=json.loads((p/"all_train.json").read_text())
          assert s["ticker"]=="00675L.TW"
          assert s["nCases"]>=500 and len(t["training"])==s["nCases"]
          assert s["benchmark"]["2026"]["returnPct"]==150.836
          assert math.isclose(s["benchmark"]["continuous"]["returnPct"],492.535,abs_tol=.005)
          assert len(s["selectedCases"])>=5
          for r in s["selectedCases"]:
            d=e["cases"][r["id"]]["dailyEquity"]
            assert len(d)==r["continuous2024_2026"]["totalSessions"]
            assert math.isclose(d[-1]["equity"],r["continuous2024_2026"]["endingNTD"],abs_tol=.05)
            assert len(e["cases"][r["id"]]["orders"])>0
          print("PASS: 00675L +492.535% buy/hold parity, 2026 +150.836% parity, all 2024-25 train ranked finalists and daily NAV audits")
          PY
      - name: Upload reproducible results
        uses: actions/upload-artifact@v4
        with:
          name: 00675l-trend-capture-rotation-2024-2026
          path: tw-stock-dashboard/docs/data/research/etf_00675l_trend_capture_2024_2026/*.json
      - name: Archive frozen study on isolated research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/research/etf_00675l_trend_capture_2024_2026
          if ! git diff --cached --quiet; then
            git commit -m "research: freeze full 00675L trend rotation vs hold archive"
            git push origin HEAD:research/00675l-trend-capture-2024-2026
          fi
