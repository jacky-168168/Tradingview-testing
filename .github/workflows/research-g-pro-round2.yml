name: G Pro Round 2 Chronological Three-Year Backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/src/research_g_pro_round2.py'
      - 'tw-stock-dashboard/tests/test_g_pro_round2.py'
      - '.github/workflows/research-g-pro-round2.yml'
permissions:
  contents: write
concurrency:
  group: research-g-pro-round2
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore historical market cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Install scientific dependencies
        run: |
          pip install -r tw-stock-dashboard/requirements.txt
          pip install beautifulsoup4
      - name: Compile and test G Pro round 2 and original gates
        run: |
          python -m py_compile tw-stock-dashboard/src/research_g_pro_round2.py
          PYTHONPATH=tw-stock-dashboard/src python -m unittest discover -s tw-stock-dashboard/tests -p 'test_g_pro*.py' -v
      - name: Verify 728 day dated official risk and run G Pro V2 vs G
        working-directory: tw-stock-dashboard
        run: python -u src/research_g_pro_round2.py
      - name: Verify all G Pro V2 results before publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tw-stock-dashboard/docs/data/research/g_pro_round2')
          s=json.loads((p/'summary.json').read_text(encoding='utf-8'))
          t=json.loads((p/'trades.json').read_text(encoding='utf-8'))
          e=json.loads((p/'equity.json').read_text(encoding='utf-8'))
          assert s['riskScoredDays']==728 and s['marketDays']==728
          assert s['GParityVerified'] and s['firstGProParityVerified']
          assert s['stockDataErrors']==0
          assert len(s['grid'])==126
          assert len(t['models'])==42
          assert s['sampleSizes']['G Pro balanced']['signalDays']>0
          assert s['primaryHorizon']==20
          assert all(x['portfolio']['dailyMaxDrawdownPct']<=0 for x in s['grid'])
          assert all(x['portfolio']['finalEquity']>0 for x in s['grid'])
          for variant,series in e['models'].items():
              assert len(series['dates'])==728 and len(series['equity'])==728,variant
          print('PASS complete 728-day G Pro round 2 comparison',s['sampleSizes'],s['lockedSelection'])
          PY
      - name: Publish audited round 2 data on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/research/g_pro_round2/
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish audited round 2 G Pro comparison'
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || { git rebase --abort || true; sleep $((i*7)); continue; }
              if git push origin HEAD:main; then exit 0; fi
              sleep $((i*7))
            done
            exit 1
          fi
