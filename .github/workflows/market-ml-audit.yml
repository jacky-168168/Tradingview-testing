name: Market Risk Score Machine Learning Independent Audit
on:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/research/market_ml_audit.py'
      - '.github/workflows/market-ml-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-ml-audit
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scikit-learn
      - name: Test chronological validation, strict purging and Brier gains
        run: |
          python -m py_compile tw-stock-dashboard/research/market_ml_audit.py
          python -u tw-stock-dashboard/research/market_ml_audit.py
      - name: Preserve ML diagnostic report without changing Risk Score
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/research/market_ml_audit/summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish independent time-series ML vs original Risk Score'
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || { git rebase --abort || true; sleep $((i*6)); continue; }
              if git push origin HEAD:main; then exit 0; fi
              sleep $((i*6))
            done
            exit 1
          fi
