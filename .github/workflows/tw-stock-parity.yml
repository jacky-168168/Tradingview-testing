name: TW Stock Historical Parity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Install
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Compare frozen 2026-10-07 production snapshot with GAS V12.2
        working-directory: tw-stock-dashboard
        run: |
          python src/validate.py --python docs/data/daily/2026-10-07.json --gas tests/fixtures/gas_2026-10-07.json --out parity.json
          python - <<'PY'
          import json
          x=json.load(open("parity.json",encoding="utf-8"))
          print(json.dumps(x,ensure_ascii=False,indent=2))
          assert x["passSuggested"], "Frozen A/D ranking parity below 80%"
          d=x.get("risk",{}).get("delta")
          assert d is None or d<=5, f"Frozen Risk score delta too large: {d}"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tw-stock-historical-parity
          path: tw-stock-dashboard/parity.json
