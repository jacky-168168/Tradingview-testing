name: TW Stock Full Parity
on:
  pull_request:
    paths:
      - 'tw-stock-dashboard/src/**'
      - 'tw-stock-dashboard/tests/fixtures/**'
      - 'tw-stock-dashboard/requirements.txt'
      - '.github/workflows/tw-stock-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore market cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-parity-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-parity-${{ runner.os }}-
            tw-stock-cache-${{ runner.os }}-
      - name: Install
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Full market pipeline
        working-directory: tw-stock-dashboard
        run: python src/pipeline.py
      - name: Compare with GAS V12.2 snapshot
        working-directory: tw-stock-dashboard
        run: |
          python src/validate.py --python docs/data/latest.json --gas tests/fixtures/gas_2026-10-07.json --out parity.json
          python - <<'PY'
          import json
          x=json.load(open("parity.json",encoding="utf-8"))
          print(json.dumps(x,ensure_ascii=False,indent=2))
          assert x["passSuggested"], "A/D Top ranking overlap below 80% threshold"
          d=x.get("risk",{}).get("delta")
          assert d is None or d<=5, f"Risk score delta too large: {d}"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tw-stock-parity-result
          path: |
            tw-stock-dashboard/docs/data/latest.json
            tw-stock-dashboard/parity.json
