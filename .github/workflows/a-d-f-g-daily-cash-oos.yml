name: A D F G Daily Cash OOS
on:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/research/cash_a_d_f_g_daily_oos.py'
      - '.github/workflows/a-d-f-g-daily-cash-oos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: a-d-f-g-daily-cash-oos
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: adfg-daily-cache-20261010
          restore-keys: |
            tw-stock-cache-
      - run: |
          pip install -r tw-stock-dashboard/requirements.txt
          pip install beautifulsoup4
      - name: Audit full-market original G and daily cash 3-year A D F G
        run: |
          python -m py_compile tw-stock-dashboard/research/cash_a_d_f_g_daily_oos.py
          PYTHONPATH=tw-stock-dashboard/src python -u tw-stock-dashboard/research/cash_a_d_f_g_daily_oos.py
      - name: Publish separate research report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/research/market_cash_oos_3y/
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish A D F G daily marked cash OOS stress results'
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || { git rebase --abort || true; sleep $((i*7)); continue; }
              if git push origin HEAD:main; then exit 0; fi
              sleep $((i*7))
            done
            exit 1
          fi
