name: G Compound V2 Consolidation Breakout Three-Year Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/src/g_compound_early_setup.py'
      - 'tw-stock-dashboard/src/research_g_compound_v2_3y.py'
      - 'tw-stock-dashboard/tests/test_g_compound_v2_3y.py'
      - '.github/workflows/research-g-compound-v2-3y.yml'
permissions:
  contents: write
concurrency:
  group: g-compound-v2-three-year
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore historical stock cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Install
        run: |
          pip install -r tw-stock-dashboard/requirements.txt
          pip install beautifulsoup4
      - name: Compile and test V2 past-only features and chronological selection
        run: |
          python -m py_compile tw-stock-dashboard/src/g_compound_early_setup.py tw-stock-dashboard/src/research_g_compound_v2_3y.py
          PYTHONPATH=tw-stock-dashboard/src python -m unittest discover -s tw-stock-dashboard/tests -p 'test_g_compound_v2_3y.py' -v
          PYTHONPATH=tw-stock-dashboard/src python -m unittest discover -s tw-stock-dashboard/tests -p 'test_g_compound_3y.py' -v
      - name: Compute full-market early-breakout selections and 50w rolling cash audit
        working-directory: tw-stock-dashboard
        run: python -u src/research_g_compound_v2_3y.py
      - name: Verify 728 official risk days, 160 models and original G parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tw-stock-dashboard/docs/data/research/g_compound_v2_3y')
          s=json.loads((p/'summary.json').read_text(encoding='utf-8'))
          t=json.loads((p/'trades.json').read_text(encoding='utf-8'))
          e=json.loads((p/'equity.json').read_text(encoding='utf-8'))
          q=json.loads((p/'picks.json').read_text(encoding='utf-8'))
          assert s['riskDays']==728 and s['marketDays']==728
          assert s['originalGUnchangedAndParityPassed']
          assert s['stockDataErrors']==0 and s['totalCases']==160 and len(s['models'])==160
          assert set(s['ruleDefinitions'])==set(q['families'])
          assert len(t['cases'])>=5 and set(t['cases'])==set(e['cases'])
          assert q['marketDays']==728 and e['dates'][-1]=='2026-10-08'
          assert s['testConfig']['trainingPeriods']['authorWindow2026'][1]=='2026-10-02'
          assert s['selectionFromTrainValidation']['status'] in ('chosen_without_2026','no_setup_passed_predefined_test')
          for x in s['models']:
              for k,v in x['periods'].items():
                  assert v['wins']+v['losses']==v['closedTrades']
                  assert v['closedTrades']<=v['filledBuys']
                  assert v['capitalEnd']>0 and v['maxDDPct']<=0
          for key,groups in t['cases'].items():
              for fold,value in groups.items():
                  ledger=e['cases'][key][fold]
                  assert ledger and abs(ledger[-1]['equity']-value['metrics']['capitalEnd'])<.02
          print('G_COMPOUND_V2_VERIFIED',json.dumps({'days':s['riskDays'],'models':s['totalCases'],
            'signalDays':s['historicalCandidates']['daysWithSignals'],'selection':s['selectionFromTrainValidation']['status']},ensure_ascii=False))
          PY
      - name: Upload reproducible V2 study
        uses: actions/upload-artifact@v4
        with:
          name: g-compound-v2-early-consolidation
          path: tw-stock-dashboard/docs/data/research/g_compound_v2_3y/
          retention-days: 90
      - name: Publish verified research to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/research/g_compound_v2_3y/
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish audited early consolidation Top1 versus original G'
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase -X theirs origin/main || { git rebase --abort || true; sleep $((i*7)); continue; }
              if git push origin HEAD:main; then exit 0; fi
              sleep $((i*7))
            done
            exit 1
          fi
