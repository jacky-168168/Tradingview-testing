name: TW Stock Python CI
on:
  pull_request:
    paths:
      - 'tw-stock-dashboard/**'
      - '.github/workflows/tw-stock-*.yml'
      - '.github/agent/test_luna_pages_fallback.py'
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/src/**'
      - 'tw-stock-dashboard/tests/**'
      - 'tw-stock-dashboard/docs/*.js'
      - 'tw-stock-dashboard/docs/*.html'
      - 'tw-stock-dashboard/requirements.txt'
      - '.github/monitor/**'
      - '.github/workflows/tw-stock-*.yml'
      - '.github/agent/test_luna_pages_fallback.py'
  schedule:
    # Daily regression independently checks main, not just open PRs. 20:00 Taipei.
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Test password-gate JavaScript and all HTML routes
        run: |
          node --check tw-stock-dashboard/docs/stock-diagnostics.js
          node --check tw-stock-dashboard/docs/site-access.js
          node tw-stock-dashboard/tests/test_site_access.cjs
          node --check tw-stock-dashboard/docs/backtest-g-panel.js
          node tw-stock-dashboard/tests/test_backtest_ui.cjs
          node tw-stock-dashboard/tests/test_dashboard_ui.cjs
      - name: Validate all first-party browser JavaScript syntax
        run: |
          for js in tw-stock-dashboard/docs/*.js; do node --check "$js"; done
      - name: Test ranking, premarket, repeat, portfolio, and other standalone UI modules
        run: |
          node --test tw-stock-dashboard/tests/*.test.cjs
          node tw-stock-dashboard/tests/test_dashboard_ui.cjs
          node tw-stock-dashboard/tests/test_g_rank_export.cjs
          node tw-stock-dashboard/tests/test_intraday_schedule.cjs
          node tw-stock-dashboard/tests/test_entry_playbook.js
          node tw-stock-dashboard/tests/test_upstream_ui.cjs
          node tw-stock-dashboard/tests/test_upstream_research_data.cjs
          node tw-stock-dashboard/tests/test_tx_premarket_ui.js
          node tw-stock-dashboard/tests/test_market_open_breadth.cjs
          node tw-stock-dashboard/tests/test_market_live_render.cjs
          node tw-stock-dashboard/tests/test_weekend_premarket_score.cjs
      - name: Compile Python
        working-directory: tw-stock-dashboard
        run: python -m compileall -q src tests
      - name: Core parity unit tests
        working-directory: tw-stock-dashboard
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate 3-year official risk, G and G Pro published evidence
        run: PYTHONPATH=tw-stock-dashboard/src python -m unittest discover -s tw-stock-dashboard/tests -p 'test_published_research_integrity.py' -v
      - name: Verify watchdog own tests
        run: python -m unittest discover -s .github/monitor -p 'test_*.py' -v
      - name: Verify Pages publishing trigger regressions
        run: python -m unittest discover -s .github/agent -p 'test_*pages_trigger.py' -v
      - name: Verify LUNA Pages fallback regression
        run: python -m unittest discover -s .github/agent -p 'test_luna_pages_fallback.py' -v
