name: TW Stock Python CI
on:
  pull_request:
    paths:
      - 'tw-stock-dashboard/**'
      - '.github/workflows/tw-stock-*.yml'
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/src/**'
      - 'tw-stock-dashboard/tests/**'
      - 'tw-stock-dashboard/docs/*.js'
      - 'tw-stock-dashboard/docs/*.html'
      - 'tw-stock-dashboard/requirements.txt'
      - '.github/monitor/**'
      - '.github/workflows/tw-stock-*.yml'
  schedule:
    # Daily regression independently checks main, not just open PRs. 20:00 Taipei.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      run_g_candle_study:
        description: '另外執行 G 2026 3D/18D K棒回測（耗時研究）'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Test password-gate JavaScript and all HTML routes
        run: |
          node --check tw-stock-dashboard/docs/stock-diagnostics.js
          node --check tw-stock-dashboard/docs/site-access.js
          node tw-stock-dashboard/tests/test_site_access.cjs
          node --check tw-stock-dashboard/docs/backtest-g-panel.js
          node tw-stock-dashboard/tests/test_backtest_ui.cjs
          node tw-stock-dashboard/tests/test_dashboard_ui.cjs
      - name: Validate all first-party browser JavaScript syntax
        run: |
          for js in tw-stock-dashboard/docs/*.js; do node --check "$js"; done
      - name: Test ranking, premarket, repeat, portfolio, and other standalone UI modules
        run: |
          node --test tw-stock-dashboard/tests/*.test.cjs
          node tw-stock-dashboard/tests/test_dashboard_ui.cjs
          node tw-stock-dashboard/tests/test_g_rank_export.cjs
          node tw-stock-dashboard/tests/test_intraday_schedule.cjs
          node tw-stock-dashboard/tests/test_entry_playbook.js
          node tw-stock-dashboard/tests/test_upstream_ui.cjs
          node tw-stock-dashboard/tests/test_tx_premarket_ui.js
      - name: Compile Python
        working-directory: tw-stock-dashboard
        run: python -m compileall -q src tests
      - name: Core parity unit tests
        working-directory: tw-stock-dashboard
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate 3-year official risk, G and G Pro published evidence
        run: PYTHONPATH=tw-stock-dashboard/src python -m unittest discover -s tw-stock-dashboard/tests -p 'test_published_research_integrity.py' -v
      - name: Verify watchdog own tests
        run: python -m unittest discover -s .github/monitor -p 'test_*.py' -v

  candle_study:
    if: github.event_name == 'workflow_dispatch' && inputs.run_g_candle_study == true
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Check 3D 18D no-lookahead logic
        working-directory: tw-stock-dashboard
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_backtest_candle.py' -v
      - name: Test G persistence no-lookahead and no-double-buy
        working-directory: tw-stock-dashboard
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_g_persistence.py' -v
      - name: Test G stage lifecycle: historical Top20, no lookahead, censored horizons
        working-directory: tw-stock-dashboard
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_g_lifecycle.py' -v
      - name: Run G_BROAD vs G_CANDLE vs G_TRIGGER 2026 backtest
        working-directory: tw-stock-dashboard
        run: python src/backtest_candle.py --start 2026-01-01 --end 2026-10-07
      - name: Save backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/backtest_g/g_candle_2026.json tw-stock-dashboard/docs/data/backtest_g/g_persistence_2026.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish G 2026 candlestick and persistence backtests"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
