name: H2 Independent Turnover Breakout 2026
on:
  push:
    branches: [research/h-v2-consolidation-2026]
    paths:
      - '.github/workflows/tw-stock-h-v2.yml'
      - 'tw-stock-dashboard/src/h_v2.py'
      - 'tw-stock-dashboard/src/backtest_h_v2.py'
      - 'tw-stock-dashboard/tests/test_h_v2.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  h2-research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore historical OHLCV cache
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Install
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Validate H2 independent signals and exits
        working-directory: tw-stock-dashboard
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/h_v2.py src/backtest_h_v2.py tests/test_h_v2.py
          python -m unittest discover -s tests -p 'test_h_v2.py' -v
      - name: Research-only 2026 H2 backtest
        working-directory: tw-stock-dashboard
        run: python src/backtest_h_v2.py
      - name: Publish H2 report artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: H2_2026_independent_consolidation_7pct
          path: tw-stock-dashboard/docs/data/backtest_h_v2/*.json
          retention-days: 30
