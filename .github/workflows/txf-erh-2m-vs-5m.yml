name: TXF ERH Trend70 2m versus 5m Historical Backtest
on:
  push:
    branches: [research/txf-extreme-reversal-trend70-2m-vs-5m]
    paths:
      - 'tw-stock-dashboard/src/research_txf_erh_2m_5m.py'
      - '.github/workflows/txf-erh-2m-vs-5m.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Install Python dependencies
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Download real TXFR1 one-minute history and backtest 2m 5m
        working-directory: tw-stock-dashboard
        run: |
          python -m py_compile src/research_txf_erh_2m_5m.py
          python -u src/research_txf_erh_2m_5m.py
      - name: Audit independent sample periods, 1-contract risk, 2m 5m matched dataset
        working-directory: tw-stock-dashboard
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path("docs/data/research/txf_extreme_reversal_2m_5m_2025_2026")
          j=json.loads((p/"summary.json").read_text())
          x=json.loads((p/"trades_and_equity.json").read_text())
          assert j["cost"]["initialEquityTWD"]==1000000
          assert j["data"]["dataQuality"][0]["timeframeMin"]==2
          assert j["data"]["dataQuality"][1]["timeframeMin"]==5
          assert len(j["results"])==36 and len(x["cases"])==36
          assert all(r["endingEquityTWD"]>0 for r in j["results"])
          assert all(math.isfinite(r["returnPct"]) for r in j["results"])
          for r in j["results"]:
            k=f'{r["timeframeMin"]}m_{r["mode"]}_{r["segment"][0][:4]}_{r["segment"][1][:4]}'
            detail=x["cases"][k]
            assert len(detail["trades"])==r["trades"]
            assert detail["equity"]
          print("PASS: 36 results with complete TXF order/curve audits, 2m/5m historical windows.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TXF-ERH-Trend70-2m-v-5m-2025-26
          path: tw-stock-dashboard/docs/data/research/txf_extreme_reversal_2m_5m_2025_2026/*.json
          retention-days: 90
      - name: Preserve reproducible research on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/research/txf_extreme_reversal_2m_5m_2025_2026
          if ! git diff --cached --quiet; then
            git commit -m "research: archive tested 2m versus 5m Trend70 futures signals and execution audit"
            git push origin HEAD:research/txf-extreme-reversal-trend70-2m-vs-5m
          fi
