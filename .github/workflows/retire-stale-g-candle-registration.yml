name: Retire Stale G Candle Action Registration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-stale-g-candle-registration.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retire verified ghost workflow IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for ID in 383973572 384048122; do
            STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$ID" --jq '.state')"
            echo "Workflow $ID was: $STATE"
            if [ "$STATE" = "active" ]; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$ID/disable"
              STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$ID" --jq '.state')"
            fi
            echo "Workflow $ID now: $STATE"
            if [ "$STATE" != "disabled_manually" ] && [ "$STATE" != "deleted" ]; then
              echo "::error::Ghost workflow $ID remains active with unwanted push checks"
              exit 1
            fi
          done
          echo "Disabling only the two legacy/duplicate candle workflows; all published research remains intact"
