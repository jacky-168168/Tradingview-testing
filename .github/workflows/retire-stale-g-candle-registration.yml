name: Retire Stale G Candle Action Registration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-stale-g-candle-registration.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Disable stale auto-failing legacy workflow registration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/378367390/disable"
          STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/378367390" --jq '.state')"
          echo "Legacy G candle workflow state: $STATE"
          test "$STATE" = "disabled_manually"
          echo "Independent manual backtest preserved as g-candle-study-on-demand.yml"
