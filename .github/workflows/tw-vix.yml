name: Taiwan VIXTWN Homepage Data
on:
  pull_request:
    paths:
      - '.github/workflows/tw-vix.yml'
      - 'tw-stock-dashboard/src/tw_vix.py'
      - 'tw-stock-dashboard/docs/tw-vix-home.js'
      - 'tw-stock-dashboard/docs/tw-vix-home.css'
      - 'tw-stock-dashboard/docs/index.html'
      - 'tw-stock-dashboard/tests/test_tw_vix.py'
      - 'tw-stock-dashboard/tests/tw-vix-home.test.cjs'
      - 'tw-stock-dashboard/docs/data/research/tw_vix/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tw-vix.yml'
      - 'tw-stock-dashboard/src/tw_vix.py'
      - 'tw-stock-dashboard/docs/tw-vix-home.js'
      - 'tw-stock-dashboard/docs/tw-vix-home.css'
  workflow_dispatch:
  schedule:
    # Taipei weekdays: 09:10/09:40 through 13:40; then 14:10 and 16:10.
    # Scheduled event can be delayed; source timestamp is always displayed.
    - cron: '10,40 1-5 * * 1-5'
    - cron: '10 6,8 * * 1-5'

permissions:
  contents: read
concurrency:
  group: taiwan-vix-source
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Taiwan VIX parser with fixed-time offline fixtures
        run: python -m unittest discover -s tw-stock-dashboard/tests -p 'test_tw_vix.py' -v
      - name: Verify homepage JavaScript and visual safeguards
        run: |
          node --check tw-stock-dashboard/docs/tw-vix-home.js
          node --test tw-stock-dashboard/tests/tw-vix-home.test.cjs
  probe-source:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose official TAIFEX public download page availability (PR only)
        run: |
          python - <<'PY'
          import re,urllib.request,urllib.error
          urls=['https://www.taifex.com.tw/cht/7/vixDaily3MNew',
                'https://www.bq888.taifex.com.tw/cht/7/vixDaily3MNew']
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
                  with urllib.request.urlopen(req,timeout=18) as response:
                      page=response.read(900000).decode('utf-8',errors='replace')
                  print('TAIFEX_DIAGNOSTIC',url,'chars',len(page))
                  for pattern in [r'2026/11',r'vixDaily3MNew',r'(?:href|action|onclick)="[^"]{1,130}(?:vix|Vix|CSV|csv)[^"]{0,130}"']:
                      match=re.search(pattern,page)
                      if match:
                          lo=max(0,match.start()-230);hi=min(len(page),match.end()+400)
                          print('PUBLIC_PAGE_FRAGMENT',re.sub(r'\\s+',' ',page[lo:hi])[:720])
              except Exception as exc:
                  print('TAIFEX_UNAVAILABLE',url,type(exc).__name__,str(exc)[:160])
          PY
      - name: Inspect TAIFEX official latest monthly VIX closing TXT file (PR only)
        run: |
          python - <<'PY'
          import urllib.request
          url='https://www.taifex.com.tw/file/taifex/Dailydownload/vix/log2data/202611new.txt'
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as r:
                  data=r.read(100000)
              text=data.decode('utf-8-sig',errors='replace')
              lines=[x.strip() for x in text.splitlines() if x.strip()]
              print('TAIFEX_TEXT_OK','bytes',len(data),'lines',len(lines),'first',lines[:4],'last',lines[-4:])
          except Exception as exc:
              print('TAIFEX_TEXT_ERROR',type(exc).__name__,str(exc)[:200])
              raise
          PY
      - name: Independently probe real public Taiwan VIXTWN source (PR only; never publish)
        run: python tw-stock-dashboard/src/tw_vix.py
      - name: Verify observed quote date on PR runner
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tw-stock-dashboard/docs/data/research/tw_vix/latest.json')
          d=json.loads(p.read_text('utf-8'))
          assert d['sourceUrl']=='https://www.wantgoo.com/index/vixtwn'
          assert d['sourceObservationAt'].startswith(d['asOfDate'])
          print('SOURCE_PROBE_OK',d['sourceObservationAt'],d['rows'][-1]['value'])
          PY
  refresh:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public VIXTWN quote with timestamp and source validation
        run: python tw-stock-dashboard/src/tw_vix.py
      - name: Verify generated observation and provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('tw-stock-dashboard/docs/data/research/tw_vix/latest.json').read_text('utf-8'))
          assert j['version']=='TW_VIX_WANTGOO_QUOTES_V1'
          assert j['sourceUrl']=='https://www.wantgoo.com/index/vixtwn'
          assert j['asOfDate']==j['rows'][-1]['date']
          assert j['sourceObservationAt'].startswith(j['asOfDate']+'T')
          print('TW_VIX_VALIDATED',j['sourceObservationAt'],j['rows'][-1]['value'])
          PY
      - name: Save dated public observation to main after review-approved workflow exists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-stock-dashboard/docs/data/research/tw_vix/latest.json
          if git diff --cached --quiet; then
            echo 'No new VIX observation; no commit required'
            exit 0
          fi
          git commit -m 'Refresh date-checked Taiwan VIXTWN public observation'
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'TW_VIX_PUBLISHED_TO_MAIN'
              exit 0
            fi
            git rebase --abort || true
            sleep $((i*5))
          done
          echo 'TW_VIX_PUBLISH_FAILED: cannot safely fast-forward main' >&2
          exit 1
