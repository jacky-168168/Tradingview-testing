name: 00675L Near BuyHold Strategy Stress
on:
  push:
    branches: [research/00675l-near-buyhold-switch-2024-2026]
    paths:
      - 'tw-stock-dashboard/src/research_00675l_near_hold_stress.py'
      - '.github/workflows/etf-00675l-near-buyhold-stress.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Restore ETF price data
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: 00675l-hold-stress-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            00675l-near-bh-${{ runner.os }}-
            00675l-holdcompare-${{ runner.os }}-
            00675l-reinvest-${{ runner.os }}-
      - name: Install requirements
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Run near-buyhold order and delay stress test
        working-directory: tw-stock-dashboard
        run: |
          python -m py_compile src/research_00675l_near_hold_stress.py
          python src/research_00675l_near_hold_stress.py
      - name: Verify original frozen model and sensitivity output
        working-directory: tw-stock-dashboard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("docs/data/research/etf_00675l_regime_capture_2024_2026/stress.json")
          z=json.loads(p.read_text())
          assert z["ticker"]=="00675L.TW"
          assert z["originalBuyholdReturnPct"]==492.535
          assert z["originalCandidateReturnPct"]==647.592
          assert z["transactionCostSensitivity"]["stats"]["0.001"][z["models"][0]]["continuous"]["returnPct"]==647.592
          assert set(z["delaySensitivity"]["stats"])=={"0","1","2"}
          assert set(z["transactionCostSensitivity"]["stats"])=={"0.001","0.003","0.005","0.01"}
          assert z["neighborhood"]["count"]==18
          print("PASS: original strategy reproducible under stress runner, delays and 18 neighbors")
          PY
      - name: Upload robustness output
        uses: actions/upload-artifact@v4
        with:
          name: etf-00675l-nearbuyhold-robustness
          path: tw-stock-dashboard/docs/data/research/etf_00675l_regime_capture_2024_2026/stress.json
      - name: Archive robustness report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/research/etf_00675l_regime_capture_2024_2026/stress.json
          if ! git diff --cached --quiet; then
            git commit -m "research: archive 00675L buyhold-switch rule stress data"
            git push origin HEAD:research/00675l-near-buyhold-switch-2024-2026
          fi
