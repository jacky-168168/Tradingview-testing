name: TX Night Risk Gate 3Y Research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/src/research_tx_night_regime_3y.py'
      - 'tw-stock-dashboard/tests/test_research_tx_night_regime_3y.py'
      - '.github/workflows/research-tx-night-regime-3y.yml'
permissions:
  contents: write
concurrency:
  group: tx-night-risk-3y
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests
      - name: Verify causality and correct TX session pairing
        run: python -m unittest discover -s tw-stock-dashboard/tests -p 'test_research_tx_night_regime_3y.py' -v
      - name: Acquire TX historical nights and calculate honest results
        run: python tw-stock-dashboard/src/research_tx_night_regime_3y.py
      - name: Publish all coverage, including unavailable data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/research/tx_night_regime_3y/
          if ! git diff --cached --quiet; then
            git commit -m "research: publish TX-night three-year real coverage and risk-screen comparisons"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
