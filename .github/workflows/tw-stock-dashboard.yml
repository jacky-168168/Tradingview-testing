name: TW Stock Dashboard

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '更新模式'
        required: true
        type: choice
        options: [auto, intraday, full]
        default: auto
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/src/**'
      - 'tw-stock-dashboard/requirements.txt'
      - 'tw-stock-dashboard/docs/*.html'
      - 'tw-stock-dashboard/docs/*.js'
      - '.github/workflows/tw-stock-dashboard.yml'
  schedule:
    # Every 30 minutes on weekday TW trading sessions at :03 / :33 Taipei.
    # Avoid GitHub's documented :00 scheduler hot spot; resync cron actor.
    # Actions schedules are best-effort: runner may start late; g_intraday.py
    # checks actual local session time and fails closed instead of faking quotes.
    - cron: '3,33 1-5 * * 1-5'
    # Same-workflow secondary slots at :09 / :39; engine skips completed slots.
    - cron: '9,39 1-5 * * 1-5'
    # Opening-session recovery: retry at 09:15, 09:45 and 10:15 Taiwan.
    # Early MIS often has incomplete OHLCV even when the exchange is open.
    - cron: '15,45 1 * * 1-5'
    - cron: '15 2 * * 1-5'
    # Independent late-morning/afternoon recovery slots to reduce empty windows
    # when an on-the-hour GitHub scheduler event is dropped.
    - cron: '20 3-5 * * 1-5'
    # Official G selections only AFTER 17:30 Asia/Taipei, with recovery.
    # 17:30 / 18:00 / 18:30 / 19:30 / 21:30 local time.
    - cron: '30 9 * * 1-5'
    - cron: '0,30 10 * * 1-5'
    - cron: '30 11 * * 1-5'
    - cron: '30 13 * * 1-5'
    # Last two same-day catch-up retries for official institutional feed outages.
    - cron: '30 14 * * 1-5'
    - cron: '15 15 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

# Isolate intraday scans from long-running full-history builds. Without this,
# full backfills can queue a 09:00 scan until after market close.
concurrency:
  group: ${{ ((github.event_name == 'schedule' && (github.event.schedule == '3,33 1-5 * * 1-5' || github.event.schedule == '9,39 1-5 * * 1-5' || github.event.schedule == '15,45 1 * * 1-5' || github.event.schedule == '15 2 * * 1-5' || github.event.schedule == '20 3-5 * * 1-5')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'intraday')) && 'tw-stock-dashboard-intraday' || 'tw-stock-dashboard-full' }}
  cancel-in-progress: false

jobs:
  build:
    # Scheduled runs must not be silently skipped if the actor is rewritten.
    # GITHUB_TOKEN commits already avoid recursively triggering push workflows.
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Resolve update mode
        id: mode
        shell: bash
        run: |
          MODE="${{ inputs.mode || 'auto' }}"
          if [ "$MODE" = "auto" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              TW_HOUR="$(TZ=Asia/Taipei date +%H%M)"
              TW_WEEKDAY="$(TZ=Asia/Taipei date +%u)"
              if [ "$TW_WEEKDAY" -le 5 ] && [ "$TW_HOUR" -ge 0900 ] && [ "$TW_HOUR" -lt 1345 ]; then MODE="intraday"; else MODE="full"; fi
            elif [ "${{ github.event_name }}" = "schedule" ]; then
              # GitHub cron execution may be delayed: use the SCHEDULED slot,
              # never the actual runner start time to choose intraday vs full.
              case "${{ github.event.schedule }}" in
                '3,33 1-5 * * 1-5'|'9,39 1-5 * * 1-5'|'15,45 1 * * 1-5'|'15 2 * * 1-5'|'20 3-5 * * 1-5') MODE="intraday" ;;
                *) MODE="full" ;;
              esac
            else
              MODE="full"
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: $MODE"
      - name: Restore market cache
        if: steps.mode.outputs.mode == 'full'
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Restore existing full-market OHLC cache for intraday G
        if: steps.mode.outputs.mode == 'intraday'
        uses: actions/cache/restore@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Install
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Wait for actual official-close publication
        id: official
        if: steps.mode.outputs.mode == 'full'
        working-directory: tw-stock-dashboard
        run: python src/check_official_ready.py
      - name: Full market update
        if: steps.mode.outputs.mode == 'full' && steps.official.outputs.ready == 'true'
        working-directory: tw-stock-dashboard
        run: python src/pipeline.py
      - name: Validate G selection frontend JavaScript
        working-directory: tw-stock-dashboard
        run: node --check docs/stock-selection.js
      - name: Verify no-trade quote and G ranking safety
        if: steps.mode.outputs.mode == 'intraday'
        working-directory: tw-stock-dashboard
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_intraday_quote_integrity.py' -v
      - name: Fast intraday Top20 price refresh
        if: steps.mode.outputs.mode == 'intraday'
        working-directory: tw-stock-dashboard
        run: python src/intraday.py
      - name: Recalculate provisional intraday G across TWSE and TPEx
        if: steps.mode.outputs.mode == 'intraday'
        working-directory: tw-stock-dashboard
        run: python src/g_intraday.py
      - name: Regenerate honest two-month repeat rankings from frozen daily snapshots
        if: steps.mode.outputs.mode == 'full' && steps.official.outputs.ready == 'true'
        working-directory: tw-stock-dashboard
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_repeated_rankings.py' -v
          python -u src/repeated_rankings.py
      - name: Commit generated JSON
        if: steps.mode.outputs.mode != 'full' || steps.official.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tw-stock-dashboard/docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Update TW stock dashboard (${{ steps.mode.outputs.mode }})"
            ok=0
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main || { git rebase --abort || true; sleep $((i*10)); continue; }
              if git push origin HEAD:main; then ok=1; break; fi
              sleep $((i*10))
            done
            [ "$ok" -eq 1 ] || exit 1
          else
            # A parallel full/intraday job may have published since checkout.
            # Deploy the newest repository snapshot, never stale artifacts.
            git pull --ff-only origin main
          fi
      - name: Configure Pages
        if: steps.mode.outputs.mode != 'full' || steps.official.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.mode.outputs.mode != 'full' || steps.official.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: tw-stock-dashboard/docs
      - name: Deploy Pages
        if: steps.mode.outputs.mode != 'full' || steps.official.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
