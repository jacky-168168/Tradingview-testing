name: TW Stock Dashboard

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '更新模式'
        required: true
        type: choice
        options: [auto, intraday, full]
        default: auto
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/src/**'
      - 'tw-stock-dashboard/requirements.txt'
      - 'tw-stock-dashboard/docs/*.html'
      - '.github/workflows/tw-stock-dashboard.yml'
  schedule:
    # Every 30 minutes on weekday TW trading sessions: 09:00, 09:30,
    # 10:00, 10:30, 11:00, 11:30, 12:00, 12:30, 13:00, 13:30 Taipei.
    # Actions schedules are best-effort: runner may start late; g_intraday.py
    # checks actual local session time and fails closed instead of faking quotes.
    - cron: '0,30 1-5 * * 1-5'
    # Official BFI82U institutional flow may be published after the close.
    # Multiple independent full retries allow the site to recover the same day.
    - cron: '10 7 * * 1-5'
    - cron: '40 7 * * 1-5'
    - cron: '20 8 * * 1-5'
    - cron: '30 10 * * 1-5'
    - cron: '30 13 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tw-stock-dashboard
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - name: Resolve update mode
        id: mode
        shell: bash
        run: |
          MODE="${{ inputs.mode || 'auto' }}"
          if [ "$MODE" = "auto" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              TW_HOUR="$(TZ=Asia/Taipei date +%H%M)"
              TW_WEEKDAY="$(TZ=Asia/Taipei date +%u)"
              if [ "$TW_WEEKDAY" -le 5 ] && [ "$TW_HOUR" -ge 0900 ] && [ "$TW_HOUR" -lt 1345 ]; then MODE="intraday"; else MODE="full"; fi
            elif [ "${{ github.event_name }}" = "schedule" ]; then
              # GitHub cron execution may be delayed: use the SCHEDULED slot,
              # never the actual runner start time to choose intraday vs full.
              case "${{ github.event.schedule }}" in
                '0,30 1-5 * * 1-5') MODE="intraday" ;;
                *) MODE="full" ;;
              esac
            else
              MODE="full"
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: $MODE"
      - name: Restore market cache
        if: steps.mode.outputs.mode == 'full'
        uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Restore existing full-market OHLC cache for intraday G
        if: steps.mode.outputs.mode == 'intraday'
        uses: actions/cache/restore@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - name: Install
        run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Full market update
        if: steps.mode.outputs.mode == 'full'
        working-directory: tw-stock-dashboard
        run: python src/pipeline.py
      - name: Fast intraday Top20 price refresh
        if: steps.mode.outputs.mode == 'intraday'
        working-directory: tw-stock-dashboard
        run: python src/intraday.py
      - name: Recalculate provisional intraday G across TWSE and TPEx
        if: steps.mode.outputs.mode == 'intraday'
        working-directory: tw-stock-dashboard
        run: python src/g_intraday.py
      - name: Regenerate honest two-month repeat rankings from frozen daily snapshots
        working-directory: tw-stock-dashboard
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_repeated_rankings.py' -v
          python -u src/repeated_rankings.py
      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tw-stock-dashboard/docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Update TW stock dashboard (${{ steps.mode.outputs.mode }})"
            ok=0
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main || { git rebase --abort || true; sleep $((i*10)); continue; }
              if git push origin HEAD:main; then ok=1; break; fi
              sleep $((i*10))
            done
            [ "$ok" -eq 1 ] || exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tw-stock-dashboard/docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
