name: TW Stock Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/docs/*.html'
      - 'tw-stock-dashboard/docs/market-command.js'
      - 'tw-stock-dashboard/docs/market-command.css'
      - 'tw-stock-dashboard/docs/data/research/market_intelligence/**'
      - 'tw-stock-dashboard/docs/data/research/market_ml_audit/**'
      - 'tw-stock-dashboard/docs/site-access.js'
      - 'tw-stock-dashboard/docs/stock-selection.js'
      - 'tw-stock-dashboard/docs/backtest-g-panel.js'
      - 'tw-stock-dashboard/docs/data/backtest_g/*.json'
      - 'tw-stock-dashboard/docs/data/research/etf_history/**'
      - 'tw-stock-dashboard/docs/data/research/g_compound_3y/**'
      - 'tw-stock-dashboard/docs/data/research/g_compound_v2_3y/**'
      - 'tw-stock-dashboard/docs/data/research/g_compound_walkforward_3y/**'
      - 'tw-stock-dashboard/docs/data/research/n_canslim/**'
      - 'tw-stock-dashboard/docs/data/research/market_cash_oos_3y/**'
      - 'tw-stock-dashboard/docs/etf-research.js'
      - 'tw-stock-dashboard/docs/etf-research.css'
      - '.github/workflows/tw-stock-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tw-stock-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate A D F G research dashboard files
        run: |
          node - <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('tw-stock-dashboard/docs/market-cash-3y.html','utf8');
          const from=html.lastIndexOf('<script>'),to=html.lastIndexOf('</script>');
          if(from<0||to<from)throw new Error('Missing inline chart script');
          new Function(html.slice(from+8,to));
          console.log('PASS: A D F G browser dashboard JavaScript syntax');
          JS
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('tw-stock-dashboard/docs/data/research/market_cash_oos_3y')
          j=json.loads((d/'summary.json').read_text())
          e=json.loads((d/'equity.json').read_text())
          assert len(j['results'])==160 and j['riskCoverage']==728
          assert 'D_GE80_10' in e and 'holdout' in e['D_GE80_10']
          c=e['D_GE80_10']['holdout']
          assert len(c['date'])==len(c['equity'])>150
          print('PASS: research JSON, 160 scenarios and 2026 daily equity curve')
          PY
      - name: Verify 00675L VT QQQ allocation page and published research data
        run: |
          node - <<'JS'
          const fs=require('fs');
          const root='tw-stock-dashboard/docs/';
          const page=fs.readFileSync(root+'etf-allocation.html','utf8');
          const start=page.lastIndexOf('<script>'),end=page.lastIndexOf('</script>');
          if(start<0||end<=start)throw new Error('Missing standalone allocation chart logic');
          new Function(page.slice(start+8,end));
          const dir=root+'data/research/etf_history/alloc_00675_vt_qqq_2018_2026/';
          const s=JSON.parse(fs.readFileSync(dir+'summary.json','utf8'));
          const e=JSON.parse(fs.readFileSync(dir+'equity.json','utf8'));
          const f=JSON.parse(fs.readFileSync(dir+'fx.json','utf8'));
          if(s.results.length!==14||Object.keys(e.portfolios).length!==14||s.dailyValuationDates!==e.dates.length||f.dates.length!==e.dates.length)throw new Error('Published portfolio dataset mismatch');
          if(s.audit.sourceCurveParity.L2_SMA10.deltaPct!==0)throw new Error('Reference benchmark diverged');
          console.log('PASS allocation browser JavaScript, 14 portfolios and aligned FX archive');
          JS
      - name: Validate G Compound 1728 audited cash-rolling scenarios
        run: |
          node - <<'JS'
          const fs=require('fs');
          const root='tw-stock-dashboard/docs/';
          const html=fs.readFileSync(root+'g-compound-3y.html','utf8');
          const from=html.lastIndexOf('<script>'),to=html.lastIndexOf('</script>');
          if(from<0||to<=from)throw new Error('Missing G Compound front end');
          new Function(html.slice(from+8,to));
          const dir=root+'data/research/g_compound_3y/';
          const summary=JSON.parse(fs.readFileSync(dir+'summary.json','utf8'));
          const executive=JSON.parse(fs.readFileSync(dir+'executive.json','utf8'));
          const trades=JSON.parse(fs.readFileSync(dir+'trades.json','utf8'));
          const equity=JSON.parse(fs.readFileSync(dir+'equity.json','utf8'));
          if(summary.totalCases!==1728||summary.riskScoreCoverage!==728||executive.models!==1728)throw new Error('Missing 728 days or 1728-model results');
          if(Object.keys(trades.auditedModels).length<9||Object.keys(equity.auditedModels).length<9)throw new Error('Missing top-1 trade ledger');
          if(executive.distribution.numberCapitalAtLeastAuthorsImpliedEnd!==0)throw new Error('Author comparison unexpectedly changed');
          if(!executive.selectedModel?.authorWindow2026)throw new Error('Train/validation chosen model absent');
          console.log('PASS G Compound front-end JS, official risk, 1728 models, funds and independent executive audit');
          JS
      - name: Validate G Compound V2 box breakout research
        run: |
          node - <<'JS'
          const fs=require('fs');
          const root='tw-stock-dashboard/docs/';
          const page=fs.readFileSync(root+'g-compound-v2-3y.html','utf8');
          const start=page.lastIndexOf('<script>'),end=page.lastIndexOf('</script>');
          if(start<0||end<=start)throw new Error('G Compound V2 front-end JS missing');
          new Function(page.slice(start+8,end));
          const dir=root+'data/research/g_compound_v2_3y/';
          const s=JSON.parse(fs.readFileSync(dir+'summary.json','utf8'));
          const t=JSON.parse(fs.readFileSync(dir+'trades.json','utf8'));
          const e=JSON.parse(fs.readFileSync(dir+'equity.json','utf8'));
          const p=JSON.parse(fs.readFileSync(dir+'picks.json','utf8'));
          if(s.totalCases!==160||s.riskDays!==728||s.marketDays!==728||!s.originalGUnchangedAndParityPassed)throw new Error('V2 unverified 160 cases or risk dates');
          if(Object.keys(t.cases).length<5||Object.keys(e.cases).length<5||!p.families['Box20 Prebreak'])throw new Error('V2 missing trace or candidate data');
          if(s.selectionFromTrainValidation.status==='chosen_without_2026'&&!s.models.some(x=>x.id===s.selectionFromTrainValidation.id))throw new Error('Selected model missing');
          console.log('PASS V2 HTML JavaScript syntax, verified risk, unchanged G, cash curves and 160 cases');
          JS
      - name: Validate G Compound V3 monthly recursive Top1 site and four result files
        run: |
          node - <<'JS'
          const fs=require('fs');
          const root='tw-stock-dashboard/docs/';
          const page=fs.readFileSync(root+'g-compound-v3-walkforward.html','utf8');
          const first=page.lastIndexOf('<script>'),last=page.lastIndexOf('</script>');
          if(first<0||last<=first)throw new Error('Missing inline G Compound V3 page script');
          new Function(page.slice(first+8,last));
          const dir=root+'data/research/g_compound_walkforward_3y/';
          const s=JSON.parse(fs.readFileSync(dir+'summary.json','utf8'));
          const t=JSON.parse(fs.readFileSync(dir+'trades.json','utf8'));
          const e=JSON.parse(fs.readFileSync(dir+'equity.json','utf8'));
          const p=JSON.parse(fs.readFileSync(dir+'picks.json','utf8'));
          if(s.marketDays!==728||s.officialRiskDays!==728||!s.GUnmodifiedParityVerified)throw new Error('Missing V3 dated risk or baseline parity');
          if(s.variantCount!==16||Object.keys(s.monthlyModelTrainingAudit).length!==8)throw new Error('V3 walkforward model grid incomplete');
          if(s.version!==t.version||s.version!==e.version||s.version!==p.version)throw new Error('V3 version mismatch');
          if(Object.keys(e.models).length<2||Object.keys(t.models).length<2)throw new Error('V3 trade ledgers missing');
          for(const sessions of Object.values(s.monthlyModelTrainingAudit))for(const m of sessions){
            if(!(m.latestMaturedLabel<m.fitAsOfFirstTradeDate))throw new Error('V3 training label leak');}
          console.log('PASS monthly recursive V3 Top1 front-end JS, 728 days, 16 model cases and as-of-month retraining proof');
          JS
      - name: Validate N CANSLIM research screen and published recursion when available
        run: |
          node - <<'JS'
          const fs=require('fs');
          const root='tw-stock-dashboard/docs/';
          const html=fs.readFileSync(root+'n-canslim.html','utf8');
          const first=html.lastIndexOf('<script>'),last=html.lastIndexOf('</script>');
          if(first<0||last<=first)throw new Error('N factor page missing client JS');
          new Function(html.slice(first+8,last));
          const dir=root+'data/research/n_canslim/';
          if(fs.existsSync(dir+'summary.json')){
            const s=JSON.parse(fs.readFileSync(dir+'summary.json','utf8'));
            const t=JSON.parse(fs.readFileSync(dir+'trades.json','utf8'));
            const e=JSON.parse(fs.readFileSync(dir+'equity.json','utf8'));
            const p=JSON.parse(fs.readFileSync(dir+'picks.json','utf8'));
            if(s.version!==t.version||s.version!==e.version||s.version!==p.version)throw new Error('N published 4-file version parity failed');
            if(s.marketDays!==728||s.officialRiskDays!==728||s.modelCount!==16)throw new Error('N research calendar/model coverage failed');
            if(!Object.keys(s.benchmark0050).length)throw new Error('Missing 0050 comparison');
            for(let list of Object.values(s.trainingAudit))for(let m of list){if(m.latestUsedLabelExit&&m.latestUsedLabelExit>=m.firstTradeDate)throw new Error('Future N model label leaked');}
            console.log('N official MOPS factor simulation and 0050 verified before Pages deploy');
          }else{console.log('N educational strategy screen JS validated; official historical research not yet published');}
          JS
      - name: Validate N integrated stock selection page
        run: |
          node - <<'JS'
          const fs=require('fs');
          const h=fs.readFileSync('tw-stock-dashboard/docs/selections.html','utf8');
          const js=fs.readFileSync('tw-stock-dashboard/docs/stock-selection.js','utf8');
          if(!h.includes('id="tabN"')||!h.includes('id="nPanel"')||!h.includes('id="stockTable"')||!h.includes('id="tb"'))throw new Error('N must use the unified selection table, not a detached page');
          if(!h.includes('href="./index.html"')||!h.includes('返回主頁'))throw new Error('Missing visible return-home link');
          if(h.includes('id="nRows"'))throw new Error('Old duplicate N ranking table unexpectedly returned');
          const home=fs.readFileSync('tw-stock-dashboard/docs/index.html','utf8');
          if(!home.includes('href="./selections.html">📋 選股排行</a>'))throw new Error('Home navigation lacks stock ranking');
          if(home.includes('href="./selections.html#N"'))throw new Error('Duplicate N button must not appear on main homepage');
          if(!h.includes('id="tabN"'))throw new Error('N selection tab must remain available on ranking page');
          new Function(js);
          if(!js.includes('function renderNTable')||!js.includes('toggleNView(true)')||!js.includes('N_TABLE_HEAD')||!js.includes('N_ARCHIVE.version!==N_SUMMARY.version'))throw new Error('N missing integrated as-of-date verified ranking renderer');
          if(!js.includes('location.hash.slice(1)'))throw new Error('N deep link cannot activate strategy tab');
          const p='tw-stock-dashboard/docs/data/research/n_canslim/';
          if(fs.existsSync(p+'summary.json')){
            const s=JSON.parse(fs.readFileSync(p+'summary.json','utf8'));
            const q=JSON.parse(fs.readFileSync(p+'picks.json','utf8'));
            if(s.version!==q.version||s.modelCount!==16||s.marketDays!==728)throw new Error('N historical selection archive has inconsistent source');
          }
          console.log('PASS explicit return home, simplified navigation, N shared ranking table, dated Top3/Top1, source provenance and browser JS syntax');
          JS
      - name: Validate G and G Pro archived history with honest missing-day handling
        run: |
          node - <<'JS'
          const fs=require('fs');
          const base='tw-stock-dashboard/docs/';
          const html=fs.readFileSync(base+'history.html','utf8');
          const pos=html.lastIndexOf('<script>'),end=html.lastIndexOf('</script>');
          if(pos<0||end<=pos)throw new Error('Historical selection JS missing');
          new Function(html.slice(pos+8,end));
          for(const model of ['G','GPro','D','F','F2','A']){
            if(!html.includes('id="'+model+'"'))throw new Error('Missing history tab '+model);
          }
          if(!html.includes('hasModel(DATA,MODEL)')||!html.includes('當日未建立此模型的歷史快照'))throw new Error('Archive must distinguish not collected from zero candidates');
          if(!html.includes('href="./index.html"'))throw new Error('History must have return homepage');
          const index=JSON.parse(fs.readFileSync(base+'data/daily/index.json','utf8'));
          if(!Array.isArray(index)||!index.length)throw new Error('Daily historical snapshot index missing');
          let witnessedG=0,witnessedGPro=0;
          for(const day of index){
            const file=base+'data/daily/'+day.date+'.json';
            if(!fs.existsSync(file))throw new Error('Missing historical daily snapshot '+day.date);
            const obj=JSON.parse(fs.readFileSync(file,'utf8'));
            if(obj.dataDate!==day.date)throw new Error('Date mismatch '+day.date);
            if(!obj.models)throw new Error('Historical model object missing '+day.date);
            if(Object.prototype.hasOwnProperty.call(obj.models,'G')){
              witnessedG++;
              if(!Array.isArray(obj.models.G)||obj.models.G.length!==day.gCount)throw new Error('Stored G count mismatch '+day.date);
            }else if(day.gCount!=null)throw new Error('G count present but G data absent '+day.date);
            if(Object.prototype.hasOwnProperty.call(obj.models,'G Pro')){
              witnessedGPro++;
              if(!Array.isArray(obj.models['G Pro'])||obj.models['G Pro'].length!==day.gProCount)throw new Error('Stored G Pro count mismatch '+day.date);
            }else if(day.gProCount!=null)throw new Error('G Pro count present but G Pro model absent '+day.date);
          }
          if(!witnessedG||!witnessedGPro)throw new Error('No genuine G and G Pro archived data found');
          console.log('PASS G and G Pro historical snapshots and integrity; days G='+witnessedG+', G Pro='+witnessedGPro);
          JS
      - name: Verify homepage decision controls, JS syntax and source alignment
        run: |
          node --check tw-stock-dashboard/docs/market-command.js
          node - <<'JS'
          const assert=require('assert'),fs=require('fs'),r=require('./tw-stock-dashboard/docs/market-command.js');
          assert.equal(r.fallback({score:46}).level,'STOP');
          assert.equal(r.fallback({score:75}).level,'READY');
          assert.equal(r.fallback({score:29,bottomState:'🟢 Strong Bottom Reversal'}).level,'REVERSAL');
          assert.equal(r.fallback({score:90,topState:'🔴 Strong Top Reversal'}).level,'STOP');
          assert.equal(r.fallback({score:85,topState:'🔴 Extreme Overbought'}).level,'CAUTION');
          const html=fs.readFileSync('tw-stock-dashboard/docs/index.html','utf8');
          ['marketCommand','commandStatus','commandBreadth','commandScore','commandAction','commandReasons','commandAi'].forEach(id=>assert(html.includes('id="'+id+'"'),id));
          const inline=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);
          inline.forEach(code=>new Function(code));
          const guide=fs.readFileSync('tw-stock-dashboard/docs/market-methodology.html','utf8');
          const scripts=[...guide.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);
          assert(scripts.length>0,'methodology page script');
          scripts.forEach(code=>new Function(code));
          assert(html.includes('./market-methodology.html'),'homepage must link researched methods');
          console.log('PASS: Homepage decision JS, HTML DOM IDs, low-score and overheat cases');
          JS
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('tw-stock-dashboard/docs/data')
          current=json.loads((root/'latest.json').read_text())
          note=json.loads((root/'research/market_intelligence/latest.json').read_text())
          ml=json.loads((root/'research/market_ml_audit/summary.json').read_text())
          assert current['risk']['score']==note['riskScore'] and current['dataDate']==note['asOf']
          assert note['research']['mlNotUsedToGate'] is True
          assert isinstance(ml['advisoryEligible'],bool)
          assert not note['research']['cautionFiltersValidatedForStockBuying']
          print('PASS: Official market score unchanged and AI is not a live trading gate')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tw-stock-dashboard/docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
