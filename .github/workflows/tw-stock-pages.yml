name: TW Stock Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/docs/*.html'
      - 'tw-stock-dashboard/docs/site-access.js'
      - 'tw-stock-dashboard/docs/data/backtest_g/*.json'
      - '.github/workflows/tw-stock-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tw-stock-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tw-stock-dashboard/docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
