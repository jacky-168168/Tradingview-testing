name: G 2026 3D18D Candle Backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tw-stock-dashboard/.g-candle-trigger'
permissions:
  contents: write
jobs:
  candle2026:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - uses: actions/cache@v4
        with:
          path: tw-stock-dashboard/cache
          key: tw-stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-stock-cache-${{ runner.os }}-
      - run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Check 3D 18D no-lookahead logic
        working-directory: tw-stock-dashboard
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_backtest_candle.py' -v
      - name: Run G_BROAD vs G_CANDLE vs G_TRIGGER 2026 backtest
        working-directory: tw-stock-dashboard
        run: python src/backtest_candle.py --start 2026-01-01 --end 2026-10-07
      - name: Save backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/backtest_g/g_candle_2026.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish 2026 G 3D18D candle backtest"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
