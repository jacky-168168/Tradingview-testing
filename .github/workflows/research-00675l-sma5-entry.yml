name: 00675L SMA5 Reentry Backtest 2018-2026
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-00675l-sma5-entry.yml'
      - 'tw-stock-dashboard/scripts/research_00675l_sma5_entry.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: 00675l-sma5-entry
  cancel-in-progress: false
jobs:
  test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Bring in verified 00675L source simulators
        shell: bash
        run: |
          set -euo pipefail
          b='research/00675l-vwma5-vs-sma10-2018-2026'
          git fetch --no-tags origin "+refs/heads/$b:refs/remotes/origin/$b"
          mkdir -p /tmp/legacy_src
          for file in research_00675l_swing_grid research_00675l_near_hold_switch research_00675l_ma_family_2020_2026 research_00675l_vwma5_sma10_2018_2026; do
            git show "origin/$b:tw-stock-dashboard/src/$file.py" > "/tmp/legacy_src/$file.py"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tw-stock-dashboard/requirements.txt
      - run: pip install -r tw-stock-dashboard/requirements.txt
      - name: Verify exact original trade/date/account parity and run SMA5 comparison
        env:
          PYTHONPATH: /tmp/legacy_src:${{ github.workspace }}/tw-stock-dashboard/src
        run: python -u tw-stock-dashboard/scripts/research_00675l_sma5_entry.py
      - name: Check output and validate original risk study is unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          d=Path("tw-stock-dashboard/docs/data/research/etf_history")
          index=json.loads((d/"index.json").read_text())
          s=next(x for x in index["studies"] if x["id"]=="00675_sma5_entry")
          old=next(x for x in index["studies"] if x["id"]=="00675_risk_v2")
          assert len(s["models"])==7 and len({m["id"] for m in s["models"]})==7
          assert len(old["models"])==22
          baseline=next(m for m in s["models"] if m["id"]=="SMA10_BASE")
          original=next(m for m in old["models"] if m["id"]=="IDX_DROP_4")
          assert (baseline["endTWD"],baseline["mddPct"],baseline["sells"])==(original["endTWD"],original["mddPct"],original["sells"])
          p=json.loads((d/"00675l_sma5_entry/summary.json").read_text())
          assert p["exactControlParity"] and p["samples"]==2128
          new=next(m for m in s["models"] if m["id"]=="SMA5_EXIT")
          old5=next(m for m in s["models"] if m["id"]=="SMA5_ABOVE")
          assert new["entryMA"]==5 and new["exitMA"]==5
          assert old5["entryMA"]==5 and old5["exitMA"]==10
          for m in s["models"]:
            curve=json.loads((d/m["curve"]).read_text())
            assert len(curve["points"])==2128
            assert curve["points"][0][0]=="2018-01-02" and curve["points"][-1][0]=="2026-10-07"
            assert abs(curve["points"][-1][1]-m["endTWD"])<.02
            assert len(m["annual"])==9
            assert len(m["splitResults"])==3
          print("PASS SMA5 entry: 7 variants including SMA5 exit, 2128 daily points, exact control parity")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 00675L-SMA5-Entry-Comparison-2018-2026
          path: |
            tw-stock-dashboard/docs/data/research/etf_history/index.json
            tw-stock-dashboard/docs/data/research/etf_history/00675l_sma5_entry/
            tw-stock-dashboard/docs/data/research/etf_history/curves/00675_sma5_entry__*.json
          retention-days: 90
      - name: Publish into permanent ETF research index
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard/docs/data/research/etf_history/index.json tw-stock-dashboard/docs/data/research/etf_history/00675l_sma5_entry tw-stock-dashboard/docs/data/research/etf_history/curves/00675_sma5_entry__*.json
          if ! git diff --cached --quiet; then
            git commit -m "data: archive 00675L SMA5 vs SMA10 reentry 2018–2026 verified models"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
